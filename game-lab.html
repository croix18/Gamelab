/* Game Lab kit. The look is Make 24's: a Deckhand board with no title strips — white cards with hard sand
   shadows on the cream grid, one navy dock bottom-left, the sea along the bottom. Coral is for alerts only.
   Each game sets --accent / --accent-pale; Make 24's accent is the board turquoise. */
:root {
  --cream: #F8F2E4; --grid: #EADFC6; --sand: #E6D5B8; --shadow: #D8C5A0;
  --turq: #40E0D0; --paleturq: #D8F6F1; --teal: #127A85;
  --navy: #17324D; --coral: #FF7F6A; --white: #FFFFFF;
  --turq-light: #BFEFEA; --turq-mid: #8FE5DC; --coral-deep: #E85F4A; --coral-pale: #FFC2B5;
  --accent: var(--turq); --accent-pale: var(--paleturq);
  --sans: "DM Sans", system-ui, sans-serif;
  --gap: clamp(12px, 1.5vw, 28px);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; font-size: clamp(15px, 0.6vw + 0.9vh, 24px); overscroll-behavior: none; } /* no pull-to-refresh or bounce mid-game */
body { overscroll-behavior: none; }
body {
  margin: 0; height: 100%; overflow: hidden;
  font-family: var(--sans); color: var(--navy); line-height: 1.3; -webkit-text-size-adjust: 100%;
  background-color: var(--cream);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 48px 48px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
/* touch panels and Chromebooks: every control answers a finger by pressing in */
.btn:active:not(:disabled), .mini:active, .pill:active, .chip:active, .gtile:active { transform: translateY(1px) scale(.97); }

/* ---------- frame ---------- */
.app {
  position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; overflow: auto;
  padding: var(--gap) var(--gap) clamp(76px, 9vh, 98px);
}
.card { background: var(--white); border-radius: 20px; box-shadow: 8px 10px 0 var(--shadow); min-width: 0; }
.label { margin: 0; color: var(--teal); font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }

/* ---------- controls ---------- */
.btn { border: 0; border-radius: 999px; background: var(--accent-pale); color: var(--navy); font-weight: 700; font-size: 1rem; padding: .65rem 1.3rem; min-height: 2.75rem; white-space: nowrap; }
.btn.primary { background: var(--accent); font-weight: 900; }
.btn.sand { background: var(--sand); }
.btn:disabled { opacity: .4; cursor: default; }
.mini { border: 0; border-radius: 999px; background: var(--sand); color: var(--navy); font-weight: 700; font-size: .85rem; padding: .3rem .85rem; min-height: 2rem; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chip { background: var(--accent-pale); color: var(--navy); border: 0; border-radius: 999px; font-weight: 700; font-size: 14px; padding: 0 14px; min-height: 40px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); font-weight: 900; }

/* ---------- dock: the one chrome bar ---------- */
#dock {
  position: fixed; left: var(--gap); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 15;
  max-width: calc(100% - 2 * var(--gap)); display: flex; align-items: center; gap: 8px;
  background: var(--navy); border-radius: 999px; box-shadow: 4px 6px 0 var(--shadow); padding: 7px;
}
#dock:empty { display: none; }
.brand { margin: 0 6px 0 10px; color: var(--turq); font-weight: 900; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.pill { background: var(--turq); color: var(--navy); border: 0; font-weight: 700; font-size: 13px; padding: 10px 16px; min-height: 40px; border-radius: 999px; white-space: nowrap; }
.pill.pale { background: var(--paleturq); }
.pill.round { width: 40px; padding: 0; display: grid; place-items: center; font-weight: 900; font-size: 18px; line-height: 1; flex: none; }
.pill svg { width: 20px; height: 20px; display: block; }
#dock :focus-visible { outline-color: var(--white); }
@media (max-width: 460px) { #dock .brand { display: none; } #dock:has(> .brand:only-child) { display: none; } }

/* ---------- the sea ---------- */
#waves { position: fixed; left: 0; bottom: 0; width: 100%; height: clamp(44px, 8vh, 88px); z-index: 0; pointer-events: none; display: block; }
.wvSand { fill: var(--sand); } .wvLight { fill: var(--turq-light); } .wvMid { fill: var(--turq-mid); }

/* ---------- sheets: how to play, setup, results ---------- */
.sheet-back {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: var(--gap);
  background: rgba(23, 50, 77, .28); animation: fade .15s ease;
}
.sheet { width: min(34rem, 100%); max-height: 100%; overflow: auto; padding: clamp(1rem, 3vh, 1.6rem) clamp(1rem, 3vw, 1.8rem); display: flex; flex-direction: column; gap: .8rem; outline: none; }
.sheet h2 { margin: 0; font-size: 1.45rem; font-weight: 900; line-height: 1.15; }
.sheet p { margin: 0; }
.sheet .label { margin-top: .3rem; }
.sheet-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .6rem; margin-top: .3rem; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- results card: made to be screenshotted ---------- */
.results { align-items: center; text-align: center; gap: .7rem; }
.r-game { font-weight: 900; font-size: 2rem; line-height: 1; }
.r-sub { color: var(--teal); font-weight: 700; }
.r-squares { display: flex; flex-wrap: wrap; justify-content: center; gap: .55rem; margin: .3rem 0; }
.r-sq { width: clamp(2.6rem, 9vh, 3.6rem); aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; font-weight: 900; font-size: 1.35rem; color: var(--navy); }
.r-sq.clean { background: var(--accent); }
.r-sq.helped { background: var(--accent-pale); box-shadow: inset 0 0 0 3px var(--accent); }
.r-sq.shown { background: var(--sand); }
.r-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem 1.8rem; }
.r-stat b { display: block; font-size: 1.7rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
.r-stat span { color: var(--teal); font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }
.r-key { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .3rem .9rem; font-size: .8rem; font-weight: 500; color: var(--teal); }
.r-key i { font-style: normal; display: inline-flex; align-items: center; gap: .35rem; }
.r-key .r-sq { width: 1.35rem; font-size: .75rem; border-radius: 5px; }
.r-key .r-sq.helped { box-shadow: inset 0 0 0 2px var(--accent); }
.results .sheet-foot { justify-content: center; }
/* a replay: one plain badge, and everything that could pass for today's result greyed out */
.r-replay { background: var(--sand); color: var(--navy); font-weight: 900; font-size: .95rem; border-radius: 999px; padding: .35rem 1rem; }
.results.replay > :not(.r-replay):not(.r-game):not(.sheet-foot) { filter: grayscale(1); opacity: .55; }

/* ---------- hub ---------- */
.hub { display: flex; flex-direction: column; gap: var(--gap); }
.today { padding: .9rem 1.1rem; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; }
.today-list { display: flex; flex-wrap: wrap; gap: .5rem; }
.today .done { font-weight: 900; margin-left: .2rem; }
.today-streak { margin: 0 0 0 auto; color: var(--teal); font-weight: 700; white-space: nowrap; }
.today-streak b { color: var(--navy); font-weight: 900; font-variant-numeric: tabular-nums; }
.hub-head { display: flex; flex-direction: column; gap: .3rem; padding: clamp(.2rem, 1vh, .6rem) .3rem 0; }
.hub-title { margin: 0; font-weight: 900; font-size: clamp(2.1rem, 6.5vh, 3.6rem); line-height: 1; letter-spacing: -.01em; }
.hub-tag { margin: 0; color: var(--teal); font-weight: 700; font-size: clamp(1rem, 2.3vh, 1.3rem); }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr)); gap: var(--gap); align-content: start; }
.gtile { border: 0; padding: clamp(1.2rem, 4.5vh, 2.4rem) 1rem clamp(1rem, 3.5vh, 1.9rem); display: flex; flex-direction: column; align-items: center; gap: clamp(.7rem, 2vh, 1.1rem); color: var(--navy); }
.gtile svg { width: clamp(4.5rem, 17vh, 8rem); height: auto; display: block; }
.gname { font-weight: 900; font-size: 1.35rem; }

/* ---------- a game's own front page ---------- */
.home { flex: 1; display: grid; place-items: center; min-height: 0; }
.home-card { width: min(40rem, 100%); padding: clamp(1.2rem, 4.5vh, 2.6rem) clamp(1.2rem, 4vw, 3rem); display: flex; flex-direction: column; align-items: center; gap: clamp(.9rem, 2.8vh, 1.7rem); text-align: center; }
/* A long one-word name (Codebreaker) shrinks to fit a phone; short names keep the full size. --chars is the longest word's length. */
.home-title { margin: 0; font-weight: 900; font-size: min(clamp(2.4rem, 7.5vh, 4.4rem), calc(137.5vw / var(--chars, 1))); line-height: 1; letter-spacing: -.01em; }
.modes { display: flex; flex-wrap: wrap; justify-content: center; gap: .7rem; }
.modes .btn { min-width: 8.5rem; font-size: 1.15rem; padding: .85rem 1.6rem; min-height: 3.2rem; }
.modes .done { margin-left: .35rem; font-weight: 900; }

@media (max-width: 560px) {
  .card { border-radius: 16px; box-shadow: 5px 6px 0 var(--shadow); }
  .modes .btn { min-width: 7rem; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== Make 24 ===== */
.mode { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.m24 { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: var(--gap); min-height: 0; }
.m24.has-timer { grid-template-columns: minmax(0, 1fr) clamp(14rem, 22vw, 20rem); }

/* ---------- the puzzle ---------- */
.m24 .stage { --card: clamp(52px, min(19vw, 21vh), 230px); display: flex; flex-direction: column; gap: clamp(.55rem, 1.6vh, 1.1rem); padding: clamp(.9rem, 2.2vh, 1.5rem) clamp(.9rem, 2vw, 1.9rem) clamp(.9rem, 2.2vh, 1.6rem); min-height: 0; }
.m24-board .stage { --card: clamp(64px, min(17vw, 22vh), 300px); }
.m24-board.has-timer .stage { --card: clamp(64px, min(14vw, 21vh), 300px); }
/* once hints or an answer are showing, the cards step back to make room for them */
.m24 .stage:has(.reveal:not(:empty)) { --card: clamp(46px, min(15vw, 13vh), 200px); }
.m24-board .stage:has(.reveal:not(:empty)) { --card: clamp(56px, min(14vw, 17vh), 260px); }
.stage-top { display: flex; align-items: center; justify-content: space-between; gap: .8rem; min-height: 1.1rem; }
.play { display: flex; flex-direction: column; align-items: center; gap: clamp(.6rem, 1.8vh, 1.3rem); padding-top: clamp(0rem, 1vh, .8rem); min-width: 0; }
.tiles { display: flex; justify-content: center; align-items: flex-start; gap: clamp(8px, 1.5vw, 30px); padding-top: calc(var(--card) * .05); padding-bottom: 1.9rem; min-height: calc(var(--card) * 1.25 + 1.9rem); }
.tile { position: relative; width: var(--card); height: calc(var(--card) * 1.2); padding: 0; border: 0; border-radius: min(22px, calc(var(--card) * .12)); background: var(--navy); color: var(--white); box-shadow: calc(var(--card) * .035) calc(var(--card) * .045) 0 var(--shadow); font-weight: 900; font-size: calc(var(--card) * .58); line-height: 1; font-variant-numeric: tabular-nums; display: grid; place-items: center; }
.tile[data-size="3"] { font-size: calc(var(--card) * .44); }
.tile[data-size="4"] { font-size: calc(var(--card) * .34); }
.tile[data-size="5"] { font-size: calc(var(--card) * .27); }
.tile.made { background: var(--paleturq); color: var(--navy); }
.tile.sel { background: var(--turq); color: var(--navy); transform: translateY(-4%); }
.tile.win { background: var(--navy); color: var(--turq); }
.tile.isNew { animation: pop .25s cubic-bezier(.34, 1.56, .64, 1); }
.tile { transition: width .2s ease, height .2s ease, font-size .2s ease; }
.tile.shake { animation: shake .3s ease; }
.tile:active { transform: translateY(1px) scale(.97); }
.tile-note { position: absolute; top: calc(100% + .65rem); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: clamp(.72rem, calc(var(--card) * .1), 1.05rem); font-weight: 700; color: var(--teal); }
@keyframes pop { from { transform: scale(.86); } to { transform: none; } }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; font-size: .62em; }
.fr > span:first-child { border-bottom: .09em solid currentColor; padding: 0 .14em .07em; }
.fr > span:last-child { padding: .09em .14em 0; }
.pw { white-space: nowrap; }
sup.ex { font-size: .68em; line-height: 0; vertical-align: baseline; position: relative; top: -.5em; margin-left: .05em; }
.tile > span:first-child sup.ex { font-size: .5em; top: -.85em; }
.neg { margin-right: .03em; }

.ops { display: flex; justify-content: center; gap: clamp(.5rem, 1.2vw, 1rem); }
.op { width: clamp(3rem, calc(var(--card) * .34), 4.6rem); aspect-ratio: 1; border: 0; border-radius: 50%; background: var(--paleturq); font-weight: 900; font-size: clamp(1.5rem, calc(var(--card) * .2), 2.5rem); line-height: 1; display: grid; place-items: center; padding: 0 0 .06em; }
.op[aria-pressed="true"] { background: var(--turq); }
.op:active { transform: translateY(1px) scale(.97); }

.work { min-height: 2.2rem; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .4rem .5rem; font-size: 1.1rem; text-align: center; max-width: 100%; }
.work .tip { color: var(--teal); font-weight: 500; font-size: .95rem; }
.step { background: var(--paleturq); border-radius: 999px; padding: .2rem .8rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.work .verdict { flex-basis: 100%; font-weight: 700; font-size: 1.15rem; color: var(--teal); }
.work .verdict.good { font-weight: 900; font-size: 1.6rem; color: var(--navy); }
.work .warn { flex-basis: 100%; }
.work .warn span { display: inline-block; background: var(--coral); border-radius: 999px; padding: .2rem .9rem; font-weight: 700; }

.grow { flex: 1; min-height: 0; }
/* the reveal gives way first when the frame is short: it shrinks and scrolls inside itself, so the buttons stay put */
.reveal { background: var(--cream); border-radius: 14px; padding: .7rem 1rem; display: flex; flex-direction: column; gap: .45rem; font-size: 1.05rem; font-weight: 500; min-width: 0; min-height: 0; overflow: auto; flex: 0 1 auto; }
.reveal:empty { display: none; }
.reveal .row { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .5rem; }
.reveal .row > .label { min-width: 6.4rem; }
.reveal b { font-weight: 900; }
.reveal .expr { font-weight: 900; font-size: 1.4rem; line-height: 1.4; }
.reveal .step { background: var(--white); }

.actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.actions .next { margin-left: auto; padding: .8rem 2rem; font-size: 1.1rem; }

/* ---------- Daily progress ---------- */
.dots { display: flex; gap: .3rem; flex: none; }
.dot { width: .95rem; height: .95rem; border-radius: 4px; background: var(--white); box-shadow: inset 0 0 0 2px var(--sand); }
.dot.now { box-shadow: inset 0 0 0 2px var(--navy); }
.dot.clean { background: var(--accent); box-shadow: none; }
.dot.helped { background: var(--accent-pale); box-shadow: inset 0 0 0 2px var(--accent); }
.dot.shown { background: var(--sand); box-shadow: none; }

/* ---------- Board timer ---------- */
.side { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.timer { padding: 1rem 1.1rem 1.1rem; display: flex; flex-direction: column; gap: .7rem; }
.clock { font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; text-align: center; font-size: clamp(3.2rem, 6vw, 6.6rem); }
.clock.low { color: var(--coral-deep); }
.bar { height: 10px; border-radius: 999px; background: var(--paleturq); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--turq); border-radius: inherit; transform-origin: left; }
.timer-btns { display: flex; gap: .6rem; }
.timer-btns .btn { flex: 1; padding-inline: .5rem; }
.timer.up { background: var(--coral); animation: alarm 1s ease-in-out infinite alternate; }
.timer.up .clock { font-size: clamp(2rem, 3.3vw, 3.5rem); letter-spacing: .02em; padding-block: .6rem; white-space: nowrap; }
.timer.up .bar { display: none; }
.timer.up .btn { background: var(--white); }
@keyframes alarm { from { background: var(--coral); } to { background: var(--coral-deep); } }

/* ---------- front page art and how to play ---------- */
.m24-art { display: flex; gap: clamp(.4rem, 1.2vw, .7rem); }
.m24-art span { width: clamp(2.6rem, 8vh, 3.8rem); height: calc(clamp(2.6rem, 8vh, 3.8rem) * 1.2); border-radius: 10px; background: var(--navy); color: var(--white); display: grid; place-items: center; font-weight: 900; font-size: clamp(1.4rem, 4.4vh, 2.1rem); box-shadow: 3px 4px 0 var(--shadow); }
.howto ol { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: .25rem; font-weight: 500; }
.howto-ex { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
.howto-ex .nums { font-weight: 900; margin-right: .3rem; }
.howto-keys { font-size: .85rem; font-weight: 500; color: var(--teal); }
.howto-keys b { color: var(--navy); }
@media (hover: none), (pointer: coarse) { .howto-keys { display: none; } }

@media (max-width: 860px) {
  .m24.has-timer { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .m24.has-timer .side { order: -1; }
  .m24.has-timer .timer { flex-direction: row; align-items: center; padding: .6rem .8rem; }
  .m24.has-timer .clock { font-size: 2rem; min-width: 4.5ch; }
  .m24.has-timer .bar { flex: 1; }
  .m24.has-timer .timer-btns .btn { min-height: 2.4rem; padding: .4rem .9rem; }
  .m24-board.has-timer .stage, .m24-board .stage { --card: clamp(52px, min(19vw, 17vh), 200px); }
  .reveal .row > .label { min-width: 100%; }
  .actions .btn { padding-inline: 1rem; }
  .actions .next { padding-inline: 1.2rem; font-size: 1rem; }
}

/* ===== Codebreaker ===== */
.cb-host { flex: 1; display: flex; flex-direction: column; min-height: 0; }
/* The pegs size to the stage: game.js sets the board's width (--pw-core, and --pw-full with the "N left" column) and
   height (--ph-all, --ph-done) measured in pegs. Wide screens set the board beside a panel at least --side wide; the peg is the
   largest that fits both ways, never below --peg-lo in height (a short screen scrolls instead). */
.cb {
  flex: 1; display: flex; flex-direction: column; min-height: 0;
  --pw: var(--pw-full); --ph: var(--ph-all);
  --gy: clamp(.55rem, 1.6vh, 1.1rem);
  --gx: clamp(1rem, 2.6vw, 3.5rem);
  --side: clamp(15rem, 34vw, 34rem);
  --peg-lo: 28px; --peg-hi: 6.5rem;
  --peg-w: calc((100cqw - var(--side) - var(--gx)) / var(--pw));
  --peg-h: calc(100cqh / var(--ph));
  --peg: min(var(--peg-w), max(var(--peg-lo), min(var(--peg-h), var(--peg-hi))));
}
.cb-m-board { --peg-hi: 7.5rem; }
.cb-stage {
  container-type: size; flex: 1; min-height: 0; outline: none; overflow-x: hidden; overflow-y: auto;
  padding: clamp(.9rem, 2.2vh, 1.5rem) clamp(.9rem, 2vw, 1.9rem);
  display: grid; grid-template-columns: auto minmax(var(--side), 34rem); justify-content: center; align-content: start; align-items: start; column-gap: var(--gx);
}
.cb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: 0; }

/* ---------- the board: the code on top, then a row per guess ---------- */
.cb-field { width: calc(var(--peg) * var(--pw)); height: calc(var(--peg) * var(--ph)); display: flex; justify-content: center; }
.cb-rows { display: flex; flex-direction: column; }
.cb-row { display: flex; align-items: center; gap: calc(var(--peg) * .3); padding: calc(var(--peg) * .06) calc(var(--peg) * .15); border-radius: calc(var(--peg) * .3); }
.cb-num { flex: none; width: calc(var(--peg) * .6); height: calc(var(--peg) * .6); display: grid; place-items: center; border-radius: 999px; color: var(--teal); font-weight: 700; font-size: calc(var(--peg) * .34); font-variant-numeric: tabular-nums; }
.cb-pegs { flex: none; display: flex; gap: calc(var(--peg) * .12); }
.cb-peg { position: relative; flex: none; width: var(--peg); height: var(--peg); border: 0; padding: 0; border-radius: calc(var(--peg) * .24); background: var(--cream); display: grid; place-items: center; color: var(--navy); }
.cb-peg .cb-sym { width: 70%; height: 70%; display: block; }
.cb-code { margin-bottom: calc(var(--peg) * .18); }
.cb-hid { background: var(--navy); color: var(--accent); font-weight: 900; font-size: calc(var(--peg) * .5); box-shadow: calc(var(--peg) * .05) calc(var(--peg) * .06) 0 var(--shadow); }
.cb-shown { background: var(--accent-pale); box-shadow: calc(var(--peg) * .05) calc(var(--peg) * .06) 0 var(--shadow); }
.cb-later .cb-peg { background: transparent; box-shadow: inset 0 0 0 2px var(--cream); }
.cb-later .cb-num { opacity: .55; }
.cb-now { background: var(--accent-pale); }
.cb-now .cb-num { color: var(--navy); font-weight: 900; }
.cb-now .cb-peg { background: var(--white); }
.cb-empty { box-shadow: inset 0 0 0 2px var(--sand); }
.cb-empty.cb-next { box-shadow: inset 0 0 0 3px var(--navy); }
.cb-slot { cursor: pointer; }
.cb-slot:active { transform: scale(.94); }
.cb-win { background: var(--accent); }
.cb-win .cb-peg { background: var(--white); }
.cb-win .cb-num { color: var(--navy); font-weight: 900; }
/* after the round: the best guess's number sits on gold; a guess that couldn't have been the code has its number ringed */
.cb-best .cb-num, .cb-gn { background: var(--accent); color: var(--navy); font-weight: 900; }
.cb-broke .cb-num { color: var(--navy); font-weight: 900; box-shadow: inset 0 0 0 2px var(--navy); }
.cb-gn { display: inline-block; padding: 0 .55em; border-radius: 999px; line-height: 1.45; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cb-gn-o { background: transparent; box-shadow: inset 0 0 0 2px var(--navy); }

/* clue marks, each with its count: ● right symbol, right spot · ○ right symbol, wrong spot */
.cb-clue { flex: none; width: calc(var(--peg) * 1.9); display: flex; align-items: center; gap: calc(var(--peg) * .24); font-size: calc(var(--peg) * .5); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.cb-mk { display: inline-flex; align-items: center; gap: .16em; }
.cb-mk-i { width: .78em; height: .78em; display: block; flex: none; }
.cb-mk.cb-zero { opacity: .4; }
.cb-rest { flex: none; width: calc(var(--peg) * 2.4); color: var(--teal); font-weight: 700; font-size: max(calc(var(--peg) * .3), .75rem); white-space: nowrap; }
.cb-rest b { color: var(--navy); font-weight: 900; font-size: 1.45em; font-variant-numeric: tabular-nums; margin-right: .2em; }

/* one-shot motion */
.cb-pop { animation: cb-pop .22s cubic-bezier(.34, 1.56, .64, 1); }
.cb-in .cb-clue, .cb-in .cb-rest { animation: cb-rise .32s ease both; }
.cb-flip { animation: cb-flip .5s cubic-bezier(.3, .7, .4, 1) both; animation-delay: calc(var(--i) * 90ms); }
.cb-shake .cb-pegs { animation: cb-shake .3s ease; }
@keyframes cb-pop { from { transform: scale(.7); } to { transform: none; } }
@keyframes cb-rise { from { opacity: 0; transform: translateX(-.4em); } to { opacity: 1; transform: none; } }
@keyframes cb-flip { from { transform: perspective(30em) rotateY(90deg); } to { transform: none; } }
@keyframes cb-shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* ---------- the panel beside the board: the line of facts, codes left (Board) or the result, the key to the marks,
   the symbols, the buttons, then hints. At the end of a round: the result, the debrief, then Next code. ---------- */
.cb-panel { min-width: 0; max-height: 100cqh; position: sticky; top: 0; min-height: 0; display: flex; flex-direction: column; gap: var(--gy); }
.cb-over .cb-reveal { order: 1; }
.cb-over .cb-actions { order: 2; }
.cb-count { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: var(--accent-pale); border-radius: 16px; padding: clamp(.6rem, 1.6vh, 1rem) clamp(.9rem, 1.4vw, 1.4rem); }
.cb-count-n { margin: 0; font-weight: 900; font-size: clamp(2.2rem, 9vh, 6rem); line-height: 1; font-variant-numeric: tabular-nums; }
.cb-verdict { flex: none; margin: 0; font-weight: 900; font-size: clamp(1.5rem, 4.4vh, 2.6rem); line-height: 1.1; text-wrap: balance; }
.cb-verdict span { display: block; margin-top: .4rem; color: var(--teal); font-weight: 700; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; }
.cb-m-board .cb-verdict { background: var(--accent-pale); border-radius: 16px; padding: clamp(.8rem, 2.2vh, 1.4rem) clamp(.9rem, 1.4vw, 1.4rem); }
.cb-legend { flex: none; display: flex; flex-wrap: wrap; gap: .3rem 1.4rem; color: var(--teal); font-weight: 700; font-size: .85rem; }
.cb-legend span { display: inline-flex; align-items: center; gap: .4rem; }
.cb-legend svg { width: 1.05em; height: 1.05em; color: var(--navy); flex: none; }

.cb-keys { flex: none; display: grid; grid-template-columns: repeat(var(--syms), minmax(0, 1fr)); gap: clamp(.35rem, .9vw, .8rem); width: 100%; max-width: calc(var(--syms) * 5.6rem); padding: 0 5px 5px 0; }
.cb-key { position: relative; aspect-ratio: 1; min-height: 2.6rem; border: 0; padding: 0; border-radius: 22%; background: var(--cream); box-shadow: 3px 4px 0 var(--shadow); display: grid; place-items: center; }
.cb-key svg { width: 62%; height: 62%; display: block; }
.cb-key i { position: absolute; top: 7%; left: 11%; font-style: normal; font-weight: 700; font-size: clamp(.62rem, 1.1vh, .8rem); color: var(--teal); }
.cb-key:active { transform: translateY(2px) scale(.95); box-shadow: 1px 2px 0 var(--shadow); }
@media (hover: none), (pointer: coarse) { .cb-key i { display: none; } }

.cb-actions { flex: none; display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.cb-actions .cb-go { margin-left: auto; min-width: 8rem; padding: .8rem 1.8rem; font-size: 1.1rem; }

.cb-reveal { background: var(--cream); border-radius: 14px; padding: .75rem 1rem; display: flex; flex-direction: column; gap: .6rem; font-size: 1.05rem; font-weight: 500; min-width: 0; min-height: 0; overflow: auto; flex: 0 1 auto; }
.cb-reveal:empty { display: none; }
.cb-tip { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .7rem; }
.cb-tip > .label { flex: none; width: 5.6rem; }
.cb-tip-body { flex: 1; min-width: min(100%, 12rem); line-height: 1.45; }
.cb-tip b { font-weight: 900; }
.cb-nm { white-space: nowrap; }
.cb-sym-in { width: 1.05em; height: 1.05em; display: inline-block; vertical-align: -.16em; margin-right: .22em; }
.cb-ci { display: inline-flex; align-items: center; gap: .18em; white-space: nowrap; vertical-align: -.08em; }
.cb-ci svg { width: .8em; height: .8em; display: block; }
.cb-ci b { font-weight: 900; }
.cb-ci b + svg { margin-left: .3em; }
.cb-try { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .4rem .6rem; margin-right: .5rem; }
.cb-try .mini { background: var(--accent); }
.cb-note { display: block; margin-top: .3rem; color: var(--teal); font-size: .92em; }

/* ---------- Board on a big screen: the panel at the front of the room, every word big enough for the back row ---------- */
@media (min-width: 1000px) and (min-height: 600px) {
  .cb-m-board .label, .cb-m-board .cb-legend, .cb-m-board .cb-verdict span, .cb-m-board .cb-key i { font-size: 1.15rem; }
  .cb-m-board .cb-reveal { font-size: 1.25rem; }
  .cb-m-board .btn, .cb-m-board .mini { font-size: 1.2rem; }
  .cb-m-board .cb-tip > .label { width: 8.6rem; }
}

/* ---------- small pieces: a row of symbols (hints, setup, how to play) and the results card's rows ---------- */
.cb-minis { display: inline-flex; gap: .25em; vertical-align: middle; }
.cb-mini { width: 1.75em; height: 1.75em; border-radius: .42em; background: var(--cream); display: grid; place-items: center; flex: none; }
.cb-mini .cb-sym { width: 70%; height: 70%; display: block; }
.cb-tip .cb-mini { background: var(--white); }
.cb-r-rows { display: flex; flex-direction: column; align-items: center; gap: .35rem; margin: .1rem 0 .2rem; }
.cb-r-row { display: flex; align-items: center; gap: .5rem; }
.cb-r-n { width: 1.2rem; text-align: right; color: var(--teal); font-weight: 700; font-size: .8rem; font-variant-numeric: tabular-nums; }
.cb-r-marks { display: flex; gap: .35rem; padding: .32rem .5rem; border-radius: 10px; background: var(--cream); color: var(--navy); }
.cb-r-win .cb-r-marks { background: var(--accent); }
.cb-r-marks .cb-mk-i { width: 1.4rem; height: 1.4rem; }
.cb-mk-none { opacity: .4; }

/* ---------- setup and how to play ---------- */
.cb-lv { display: flex; flex-direction: column; gap: .45rem; background: var(--cream); border-radius: 14px; padding: .75rem 1rem; }
.cb-lv p { font-weight: 700; color: var(--teal); font-size: .92rem; }
.cb-lv .cb-lv-n { color: var(--navy); font-weight: 500; font-variant-numeric: tabular-nums; }
.cb-lv .cb-lv-n b { font-weight: 900; }
.cb-lv .cb-minis { font-size: 1.15rem; flex-wrap: wrap; }
.cb-lv .cb-mini { background: var(--white); }
.howto ol { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: .25rem; font-weight: 500; }
.cb-howto-key { display: flex; flex-wrap: wrap; gap: .2rem 1.2rem; margin-top: .25rem; font-weight: 700; }
.cb-howto-key span { display: inline-flex; align-items: center; gap: .4rem; }
.cb-howto-key svg { width: 1.05em; height: 1.05em; flex: none; }
.cb-howto-ex { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: .45rem .8rem; background: var(--cream); border-radius: 14px; padding: .75rem 1rem; }
.cb-howto-ex .cb-mini { background: var(--white); }
.cb-howto-ex .cb-clue { --peg: 2.5rem; width: auto; }
.cb-howto-keys { font-size: .85rem; font-weight: 500; color: var(--teal); }
.cb-howto-keys b { color: var(--navy); }
@media (hover: none), (pointer: coarse) { .cb-howto-keys { display: none; } }

/* ---------- front page art ---------- */
.cb-art { display: flex; gap: clamp(.4rem, 1.2vw, .7rem); }
.cb-art-peg { width: clamp(2.8rem, 8.5vh, 4rem); aspect-ratio: 1; border-radius: 12px; background: var(--cream); display: grid; place-items: center; box-shadow: 3px 4px 0 var(--shadow); }
.cb-art-peg .cb-sym { width: 66%; height: 66%; display: block; }
.cb-art-hid { background: var(--navy); color: var(--accent); font-weight: 900; font-size: clamp(1.4rem, 4.2vh, 2.1rem); }

/* ---------- portrait screens and phones: one column. The board keeps its size (hints never shrink it); only the
   newest hint shows, and below the board the hints give way first. Play and Daily make room for "N left" only
   once the round is over, when the empty rows go too. ---------- */
@media (max-aspect-ratio: 1/1) {
  .cb {
    --pw: var(--pw-core);
    --rest-h: calc(11rem + 5 * var(--gy) + 100cqw / var(--syms)); /* the line of facts, the key, a two-line hint, the symbols, the buttons */
    --peg-w: calc(100cqw / var(--pw));
    --peg-h: calc((100cqh - var(--rest-h)) / var(--ph));
  }
  .cb.cb-over, .cb.cb-m-board { --pw: var(--pw-full); }
  .cb.cb-over { --ph: var(--ph-done); }
  .cb:not(.cb-over):not(.cb-m-board) .cb-rest { display: none; }
  .cb-over .cb-later { display: none; }
  .cb-stage { display: flex; flex-direction: column; align-items: stretch; gap: var(--gy); }
  .cb-panel { display: contents; }
  .cb-field { width: 100%; flex: none; }
  .cb .cb-meta { order: -2; }
  .cb .cb-field { order: -1; }
  .cb .cb-reveal { order: 1; }
  .cb .cb-keys { order: 3; align-self: center; margin-top: auto; }
  .cb .cb-actions { order: 4; }
  .cb-over .cb-actions { margin-top: auto; }
  .cb-reveal .cb-hint:not(:last-child) { display: none; }
  .cb-verdict { text-align: center; font-size: 1.6rem; }
  .cb-reveal { font-size: 1rem; padding: .5rem .8rem; }
  .cb-note { margin-top: .2rem; }
  .cb-tip > .label { width: 100%; }
  .cb-count { padding: .4rem .9rem; }
  .cb-count-n { font-size: 2.2rem; }
  .cb-legend { font-size: .78rem; gap: .2rem 1rem; justify-content: center; }
  .cb-actions .btn { padding-inline: 1.1rem; }
  .cb-actions .cb-go { min-width: 0; padding-inline: 1.7rem; font-size: 1.05rem; }
}

/* ===== 2048 ===== */
:root { --t48-well: #E9DFCA; --t48-hole: #F6F0E4; }
.t48-host { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.t48-game {
  flex: 1; display: flex; min-height: 0;
  --t48-move: 110ms; /* keep in step with MOVE_MS in game.js */
  --t48-eqf: clamp(1.05rem, 3vh, 2.2rem);
}

/* ---------- tiles: sand and pale turquoise, deepening through turquoise and teal to navy; 2048 is gold ---------- */
.t48-e1 { background: #EAD6AE; color: var(--navy); }
.t48-e2 { background: #CFF2EC; color: var(--navy); }
.t48-e3 { background: #A3E9E0; color: var(--navy); }
.t48-e4 { background: #74DCD1; color: var(--navy); }
.t48-e5 { background: #3FCFC1; color: var(--navy); }
.t48-e6 { background: #1FB1A8; color: var(--navy); }
.t48-e7 { background: #15939B; color: var(--white); }
.t48-e8 { background: #127A85; color: var(--white); }
.t48-e9 { background: #0F5C6D; color: var(--white); }
.t48-e10 { background: var(--navy); color: var(--white); }
.t48-e11 { background: #F2B640; color: var(--navy); }
.t48-e12 { background: #0B1C2D; color: #F2B640; }
.t48-pw { white-space: nowrap; }
sup.t48-ex { font-size: .56em; line-height: 0; position: relative; top: -.68em; margin-left: .03em; vertical-align: baseline; letter-spacing: 0; }

/* ---------- the stage: one column on phones; on wider screens the board, with its panel beside it ---------- */
.t48-stage {
  flex: 1; min-width: 0; min-height: 0; container-type: size;
  display: flex; flex-direction: column; gap: clamp(.55rem, 1.5vh, 1rem);
  padding: clamp(.9rem, 2.2vh, 1.5rem) clamp(.9rem, 2vw, 1.9rem);
  touch-action: none; /* no swipe anywhere on the game scrolls or zooms the page */
}
.t48-head { display: flex; flex-direction: column; gap: clamp(.45rem, 1.2vh, .8rem); }
.t48-stats { display: flex; flex-wrap: wrap; gap: .4rem clamp(1.2rem, 2.4vw, 2.2rem); }
.t48-stat { display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
.t48-stat b { font-weight: 900; font-size: clamp(1.45rem, 4.4vh, 2.7rem); line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* slides left, with its own bar in a neutral color */
.t48-left { min-width: 6.2rem; }
.t48-lbar { display: block; height: 6px; margin-top: .3rem; border-radius: 999px; background: #EEE6D7; overflow: hidden; }
.t48-lbar i { display: block; height: 100%; border-radius: inherit; background: #8D99A6; transform-origin: left; transition: transform .2s ease; }

.t48-play {
  flex: 1 1 0; min-height: 0; container-type: size;
  display: flex; align-items: center; justify-content: center;
  -webkit-user-select: none; user-select: none;
  --t48-s: min(100cqw, 100cqh);
}

/* ---------- the board ---------- */
.t48-board {
  --t48-g: calc(var(--t48-s) * .03);
  --t48-cell: calc((var(--t48-s) - 5 * var(--t48-g)) / 4);
  position: relative; flex: none; width: var(--t48-s); height: var(--t48-s); padding: var(--t48-g);
  border-radius: calc(var(--t48-s) * .045); background: var(--t48-well);
}
.t48-cells { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: var(--t48-g); width: 100%; height: 100%; }
.t48-cells i { border-radius: calc(var(--t48-cell) * .12); background: var(--t48-hole); }
.t48-tiles { position: absolute; inset: var(--t48-g); }
.t48-tile {
  position: absolute; left: 0; top: 0; width: var(--t48-cell); height: var(--t48-cell);
  transform: translate(calc(var(--t48-x) * (var(--t48-cell) + var(--t48-g))), calc(var(--t48-y) * (var(--t48-cell) + var(--t48-g))));
  transition: transform var(--t48-move) ease-in-out;
}
.t48-under { z-index: 1; }
.t48-new { z-index: 1; }
.t48-merged { z-index: 2; }
.t48-face {
  width: 100%; height: 100%; border-radius: calc(var(--t48-cell) * .12);
  display: grid; place-items: center; font-weight: 900; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  font-size: calc(var(--t48-cell) * .5);
  box-shadow: 0 calc(var(--t48-cell) * .045) 0 rgba(23, 50, 77, .13);
}
.t48-face[data-d="d2"] { font-size: calc(var(--t48-cell) * .46); }
.t48-face[data-d="d3"] { font-size: calc(var(--t48-cell) * .37); }
.t48-face[data-d="d4"] { font-size: calc(var(--t48-cell) * .29); }
.t48-face[data-d="d5"] { font-size: calc(var(--t48-cell) * .235); }
.t48-face[data-d="p1"] { font-size: calc(var(--t48-cell) * .44); }
.t48-face[data-d="p2"] { font-size: calc(var(--t48-cell) * .37); }
.t48-merged .t48-face { animation: t48-pop .2s ease var(--t48-move) both; }
.t48-new .t48-face { animation: t48-in .2s ease var(--t48-move) both; }
.t48-nudge { animation: t48-nudge .22s ease; }
@keyframes t48-pop { 0% { transform: scale(.5); opacity: 0; } 55% { transform: scale(1.1); opacity: 1; } 100% { transform: none; } }
@keyframes t48-in { from { transform: scale(.25); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes t48-nudge { 40% { transform: translate(var(--t48-nx), var(--t48-ny)); } }

/* ---------- the merge, as an equation: under the board on phones, beside it on wider screens ---------- */
.t48-eq { flex: none; min-height: calc(var(--t48-eqf) * 2.1); max-width: 100%; display: flex; align-items: center; justify-content: center; font-size: var(--t48-eqf); }
.t48-sum { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .3em .32em; font-weight: 900; transition: opacity .25s ease; animation: t48-fade .18s ease backwards; }
.t48-ln { display: inline-flex; align-items: center; gap: .32em; white-space: nowrap; }
.t48-q { display: inline-grid; place-items: center; min-width: 2em; height: 1.6em; padding: 0 .42em; border-radius: .34em; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.t48-op { color: var(--teal); }
.t48-prod { display: inline-flex; align-items: center; gap: .2em; }
.t48-dim .t48-sum { opacity: .35; } /* the latest merge stays up, dimmed, until the next one */
.t48-tip { font-size: clamp(.95rem, 2.2vh, 1.15rem); font-weight: 500; color: var(--teal); text-align: center; }
.t48-tip-touch { display: none; }
@media (hover: none), (pointer: coarse) { .t48-tip-touch { display: inline; } .t48-tip-keys { display: none; } }
@keyframes t48-fade { from { opacity: .3; } }

/* ---------- hint, end of game, actions ---------- */
.t48-info { min-height: 3.9rem; display: flex; flex-direction: column; justify-content: center; }
.t48-hint { background: var(--cream); border-radius: 14px; padding: .65rem .9rem .65rem .65rem; }
.t48-hint .label { display: block; margin: 0 0 .3rem .15rem; }
.t48-hint p { margin: 0; display: flex; align-items: center; gap: .7rem; font-size: clamp(1rem, 2.4vh, 1.3rem); font-weight: 500; line-height: 1.25; }
.t48-hint b { font-weight: 900; }
.t48-hint .t48-arrow { flex: none; width: 2.3em; height: 2.3em; border-radius: 50%; background: var(--accent); color: var(--navy); }
.t48-hint .t48-arrow svg { width: 1.15em; height: 1.15em; }
.t48-end { margin: 0; font-weight: 900; font-size: clamp(1.45rem, 3.8vh, 2.3rem); line-height: 1.1; }
.t48-actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.t48-arrow { display: inline-grid; place-items: center; vertical-align: middle; }
.t48-arrow svg { width: 1em; height: 1em; display: block; }
.t48-to-up svg { transform: rotate(90deg); }
.t48-to-right svg { transform: rotate(180deg); }
.t48-to-down svg { transform: rotate(-90deg); }

/* ---------- Board: arrows the teacher taps ---------- */
.t48-pad { --t48-pb: clamp(3rem, 6.4vh, 4.6rem); display: grid; grid-template-columns: repeat(3, var(--t48-pb)); grid-template-areas: ". up ." "left . right" ". down ."; gap: .35rem; justify-content: center; }
.t48-pad-btn { width: var(--t48-pb); height: var(--t48-pb); border: 0; border-radius: 50%; padding: 0; background: var(--accent-pale); color: var(--navy); display: grid; place-items: center; }
.t48-pad-btn .t48-arrow svg { width: calc(var(--t48-pb) * .42); height: calc(var(--t48-pb) * .42); }
.t48-pad-btn[data-dir="up"] { grid-area: up; }
.t48-pad-btn[data-dir="left"] { grid-area: left; }
.t48-pad-btn[data-dir="right"] { grid-area: right; }
.t48-pad-btn[data-dir="down"] { grid-area: down; }
.t48-pad-btn.t48-pad-hint { background: var(--accent); box-shadow: 0 0 0 4px var(--white), 0 0 0 7px var(--accent); }
.t48-pad-btn:disabled { opacity: .4; cursor: default; }
.t48-pad-btn:active:not(:disabled) { transform: translateY(1px) scale(.96); }
@media (max-width: 559px) { .t48-pad { display: none; } }

@media (min-aspect-ratio: 1/1) and (min-width: 640px) {
  .t48-game { --t48-side: clamp(15rem, 27vw, 26rem); --t48-cgap: clamp(1.5rem, 3.6vw, 4.5rem); }
  .t48-stage {
    display: grid; grid-template-columns: auto var(--t48-side); grid-template-rows: auto auto auto auto auto minmax(0, 1fr);
    grid-template-areas: "play head" "play eq" "play info" "play pad" "play actions" "play .";
    column-gap: var(--t48-cgap); row-gap: clamp(.8rem, 2.4vh, 1.6rem); justify-content: center;
  }
  .t48-play {
    grid-area: play; container-type: normal; align-self: center;
    --t48-s: min(100cqh, 100cqw - var(--t48-side) - var(--t48-cgap));
    width: var(--t48-s); height: var(--t48-s);
  }
  .t48-head { grid-area: head; }
  /* the equation, big, in the panel: one line per step */
  .t48-eq { grid-area: eq; justify-content: flex-start; min-height: 0; font-size: clamp(1.3rem, min(4.8vh, calc(var(--t48-side) / 8.6)), 3.8rem); }
  .t48-sum { flex-direction: column; align-items: flex-start; gap: .28em; }
  .t48-tip { text-align: left; }
  .t48-info { grid-area: info; justify-content: flex-start; min-height: 6.2rem; }
  .t48-pad { grid-area: pad; justify-content: start; }
  .t48-actions { grid-area: actions; }
}

/* ---------- small boards: the results card, the review, how to play ---------- */
.t48-mini {
  --t48-m: clamp(2.2rem, 6.4vh, 3rem);
  display: inline-grid; grid-template-columns: repeat(4, var(--t48-m)); gap: calc(var(--t48-m) * .1);
  padding: calc(var(--t48-m) * .12); border-radius: calc(var(--t48-m) * .28); background: var(--t48-well);
}
.t48-mini > span {
  width: var(--t48-m); height: var(--t48-m); border-radius: calc(var(--t48-m) * .18);
  display: grid; place-items: center; font-weight: 900; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  font-size: calc(var(--t48-m) * .5);
}
:where(.t48-mini > span) { background: var(--t48-hole); } /* an empty square; a tile's own color wins */
.t48-mini > span[data-d="d2"] { font-size: calc(var(--t48-m) * .44); }
.t48-mini > span[data-d="d3"] { font-size: calc(var(--t48-m) * .35); }
.t48-mini > span[data-d="d4"] { font-size: calc(var(--t48-m) * .28); }
.t48-mini > span[data-d="d5"] { font-size: calc(var(--t48-m) * .22); }
.t48-mini > span[data-d="p1"] { font-size: calc(var(--t48-m) * .42); }
.t48-mini > span[data-d="p2"] { font-size: calc(var(--t48-m) * .35); }
.t48-mini > span.t48-key { position: relative; z-index: 1; box-shadow: 0 0 0 calc(var(--t48-m) * .06) var(--white), 0 0 0 calc(var(--t48-m) * .13) var(--navy); }
.t48-results .t48-mini { margin: .1rem auto .2rem; }
.t48-results .r-stats { gap: .4rem 1.5rem; }
.r-stat .t48-pw { font-size: 1em; font-weight: inherit; color: inherit; letter-spacing: 0; text-transform: none; }
/* "Look-ahead player: 2,004", and a cheer when the student beats it */
.t48-vs { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .35rem .6rem; font-size: 1.05rem; font-weight: 700; color: var(--teal); }
.t48-vs b { color: var(--navy); font-weight: 900; font-variant-numeric: tabular-nums; }
.t48-won { background: var(--accent); color: var(--navy); font-weight: 900; border-radius: 999px; padding: .25rem .85rem; }
.t48-beat .t48-won { animation: t48-pop .45s ease both; }

.t48-sheet h2 sup.t48-ex, .t48-end sup.t48-ex { top: -.72em; }
.t48-review { width: min(72rem, 100%); }
.t48-review .r-stats { justify-content: flex-start; }
.t48-costs-label { margin-top: .4rem; }
/* each costly slide: the board after it, beside the board after the better slide */
.t48-costs { display: flex; flex-wrap: wrap; justify-content: center; gap: .8rem; }
.t48-cost { --t48-cm: clamp(1.4rem, 3.9vh, 2.3rem); width: min-content; max-width: 100%; background: var(--cream); border-radius: 14px; padding: .75rem .8rem .85rem; display: flex; flex-direction: column; align-items: center; gap: .5rem; text-align: center; }
.t48-cost .t48-mini { --t48-m: var(--t48-cm); }
.t48-pair { display: flex; gap: .8rem; }
.t48-pair figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: .35rem; }
.t48-pair figcaption { display: inline-flex; align-items: center; gap: .3rem; white-space: nowrap; font-weight: 500; color: var(--teal); }
.t48-pair figcaption b { color: var(--navy); font-weight: 900; }
.t48-pair figcaption .t48-arrow { margin-left: .1rem; color: var(--navy); }
.t48-why, .t48-none, .t48-wait { font-weight: 500; }
.t48-none, .t48-wait { width: 100%; text-align: center; }
.t48-wait { color: var(--teal); }
@media (max-width: 480px) { .t48-cost { --t48-cm: 1.75rem; } }
/* the Board's review: big enough to read across a classroom */
.t48-big { width: min(110rem, 100%); }
.t48-big .t48-cost { --t48-cm: clamp(1.8rem, min(5.2vh, 2.85vw), 3.6rem); padding: 1rem 1.1rem 1.1rem; gap: .7rem; }
.t48-big h2 { font-size: clamp(1.45rem, 4.2vh, 3rem); }
.t48-big .label, .t48-big .r-stat span { font-size: clamp(.72rem, 2.25vh, 1.6rem); }
.t48-big .r-stat b { font-size: clamp(1.7rem, 5vh, 3.6rem); }
.t48-big .t48-why, .t48-big .t48-none, .t48-big .t48-wait, .t48-big figcaption { font-size: clamp(1rem, 2.6vh, 2rem); }
.t48-big .btn { font-size: clamp(1rem, 2.4vh, 1.8rem); min-height: 2.4em; padding: .5em 1.3em; }
.t48-cheer { align-items: center; text-align: center; }
.t48-cheer .sheet-foot { justify-content: center; }

.t48-setup .t48-levels { display: flex; flex-direction: column; gap: .8rem; }
.t48-goal { font-weight: 500; color: var(--teal); }
.t48-chipx { margin-left: .4rem; padding: .1rem .45rem; border-radius: 7px; background: rgba(255, 255, 255, .75); font-weight: 900; }

/* ---------- front page art and how to play ---------- */
.t48-art { display: flex; align-items: center; gap: clamp(.4rem, 1.2vw, .75rem); }
.t48-art span { min-width: clamp(3rem, 9vh, 4.2rem); height: clamp(3rem, 9vh, 4.2rem); padding: 0 .5em; border-radius: 12px; display: grid; place-items: center; font-weight: 900; font-size: clamp(1.15rem, 3.4vh, 1.65rem); letter-spacing: -.02em; box-shadow: 3px 4px 0 var(--shadow); }
.t48-art i { font-style: normal; font-weight: 900; font-size: clamp(1.25rem, 3.6vh, 1.8rem); color: var(--teal); }
.t48-howto-ex { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem .5rem; }
.t48-howto-step { flex-basis: 100%; font-weight: 700; }
.t48-exrow { --t48-m: 1.7rem; }

<script>
/* ===== Game Lab kit: storage, daily seeds, sound, sheets, results card, dock and screens =====
   Every game registers with Lab.register() and only touches the element it is mounted in.
   Nothing here talks to the network, and nothing about a student is ever asked for or kept. */
(function (global) {
  'use strict';
  const doc = global.document;
  const Lab = global.Lab = {};
  const pad2 = n => String(n).padStart(2, '0');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  Lab.esc = esc;

  /* ---------- storage: this browser only; every call survives storage being blocked or wiped ---------- */
  const PREFIX = 'gamelab.';
  Lab.store = {
    get(key, fallback) {
      try { const raw = global.localStorage.getItem(PREFIX + key); return raw === null ? fallback : JSON.parse(raw); }
      catch (e) { return fallback; }
    },
    set(key, value) {
      try { global.localStorage.setItem(PREFIX + key, JSON.stringify(value)); return true; }
      catch (e) { return false; }
    }
  };

  /* ---------- seeded randomness: a Daily is the same puzzle on every device that day ---------- */
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  Lab.hash = hash;
  Lab.rng = seed => mulberry32(typeof seed === 'string' ? hash(seed) : seed);
  const isoOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  Lab.today = () => isoOf(new Date());
  Lab.dailyRng = (gameId, date) => Lab.rng(gameId + '|daily|' + (date || Lab.today()));
  Lab.dateWords = function (iso) {
    const p = iso.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  };
  Lab.clock = function (ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ':' + pad2(s % 60);
  };

  /* ---------- sound: off by default for solo play (a room of Chromebooks), on for the board ---------- */
  let actx = null;
  const TONES = {
    solve: { type: 'sine', gain: .22, seq: [[523, 0], [659, .09], [784, .18], [1047, .27]] },
    up: { type: 'triangle', gain: .22, seq: [[660, 0], [660, .24], [440, .48]] },
    step: { type: 'sine', gain: .07, seq: [[740, 0]] }
  };
  Lab.sound = {
    on: false,
    play(kind) {
      const tone = TONES[kind];
      if (!this.on || !tone) return;
      try {
        const AC = global.AudioContext || global.webkitAudioContext;
        if (!AC) return;
        actx = actx || new AC();
        if (actx.state === 'suspended') actx.resume();
        const now = actx.currentTime;
        tone.seq.forEach(([f, t]) => {
          const o = actx.createOscillator(), g = actx.createGain();
          o.type = tone.type;
          o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, now + t);
          g.gain.exponentialRampToValueAtTime(tone.gain, now + t + .02);
          g.gain.exponentialRampToValueAtTime(0.0001, now + t + .34);
          o.connect(g); g.connect(actx.destination);
          o.start(now + t); o.stop(now + t + .4);
        });
      } catch (e) { /* no audio here: play on silently */ }
    }
  };

  /* ---------- sheets ---------- */
  let openSheet = null;
  Lab.sheetOpen = () => !!openSheet;
  Lab.closeSheet = () => { if (openSheet) openSheet.close(true); };
  Lab.sheet = function (inner, opts) {
    opts = opts || {};
    if (openSheet) openSheet.close(true);
    const back = doc.createElement('div');
    back.className = 'sheet-back';
    back.innerHTML = '<div class="card sheet' + (opts.cls ? ' ' + opts.cls : '') + '" role="dialog" aria-modal="true" aria-label="' +
      esc(opts.label || 'Dialog') + '" tabindex="-1">' + inner + '<div class="sheet-foot">' + (opts.extra || '') +
      '<button class="btn primary" type="button" data-close>' + esc(opts.done || 'Done') + '</button></div></div>';
    const box = back.firstElementChild;
    const before = doc.activeElement;
    function close(silent) {
      if (!back.isConnected) return;
      back.remove();
      doc.removeEventListener('keydown', onKey, true);
      if (openSheet && openSheet.el === box) openSheet = null;
      if (!silent && opts.onClose) opts.onClose();
      if (!silent && before && before.isConnected && before.focus) before.focus();
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); return; }
      if (e.key === 'Tab') { /* keep focus inside the sheet */
        const f = Array.from(box.querySelectorAll('button:not(:disabled), [href], input, select, [tabindex]:not([tabindex="-1"])'));
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && doc.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && doc.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    const opened = Date.now(); /* the second tap of a double tap that opened the sheet must not close it from the backdrop */
    back.addEventListener('click', e => {
      if (e.target.closest('[data-close]')) close();
      else if (e.target === back && Date.now() - opened >= 450) close();
    });
    doc.addEventListener('keydown', onKey, true);
    doc.body.appendChild(back);
    (box.querySelector('[data-close]') || box).focus({ preventScroll: true });
    openSheet = { el: box, close };
    return openSheet;
  };

  /* ---------- results card ---------- */
  const SQ = {
    clean: ['✓', 'solved without hints'],
    helped: ['✓', 'solved with hints'],
    shown: ['–', 'answer shown']
  };
  /* r: { game, sub, squares?: ['clean' | 'helped' | 'shown'], body?: html of the game's own, stats: [[value, label]], key?: false,
          replay?: true — a Daily played again: the card says so and greys out, so it can't pass for the day's result,
          streak?: true — a Daily card: adds the day streak (days in a row with a Daily done; save the result first) } */
  Lab.results = function (r, opts) {
    const sq = r.squares || [];
    const squares = sq.length ? '<div class="r-squares">' + sq.map((s, i) => '<span class="r-sq ' + s + '" role="img" aria-label="' + (i + 1) + ': ' + SQ[s][1] + '">' + SQ[s][0] + '</span>').join('') + '</div>' : '';
    const streak = r.streak && !r.replay ? Lab.dailyStreak() : 0;
    const stats = r.stats.concat(streak ? [[String(streak), 'Day streak']] : []).map(s => '<div class="r-stat"><b>' + esc(s[0]) + '</b><span>' + esc(s[1]) + '</span></div>').join('');
    const key = sq.length && r.key !== false ? '<p class="r-key">' + ['clean', 'helped', 'shown'].map(s => '<i><span class="r-sq ' + s + '" aria-hidden="true">' + SQ[s][0] + '</span>' +
      (s === 'clean' ? 'No hints' : s === 'helped' ? 'With hints' : 'Shown') + '</i>').join('') + '</p>' : '';
    const html = (r.replay ? '<p class="r-replay">Replay · not today\u2019s result</p>' : '') +
      '<p class="r-game">' + esc(r.game) + '</p><p class="r-sub">' + esc(r.sub) + '</p>' + squares + (r.body || '') +
      '<div class="r-stats">' + stats + '</div>' + (r.replay ? '' : key);
    return Lab.sheet(html, Object.assign({ cls: 'results' + (r.replay ? ' replay' : ''), label: r.game + (r.replay ? ' replay' : '') + ' results' }, opts));
  };

  /* ---------- screens: hub, a game's front page, a mode ---------- */
  const games = [];
  const MODE_NAME = { play: 'Play', daily: 'Daily', board: 'Board' };
  const ICON = {
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    soundOn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.8L12 5.5v13l-4.7-3.7H3.5z" fill="currentColor"/><path d="M15.4 9a4.2 4.2 0 0 1 0 6M17.9 6.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.8L12 5.5v13l-4.7-3.7H3.5z" fill="currentColor"/><path d="m15.5 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
  };
  const shell = { single: null, screen: null, game: null, mode: null, session: null, extras: [], redock: () => {} };

  Lab.register = function (game) { games.push(game); };
  const byId = id => games.find(g => g.id === id);

  /* The hub's name and tagline. */
  const HUB = { name: 'Game Lab', tagline: 'Train your brain. Master the game.' };

  /* Days in a row with at least one Daily done. Today counts once it is done, and a weekend never breaks a streak. */
  Lab.dailyStreak = function (from) {
    const dailies = games.filter(g => g.dailyDone);
    if (!dailies.length) return 0;
    const d = from ? new Date(from.getTime()) : new Date();
    const done = () => dailies.some(g => { try { return !!g.dailyDone(isoOf(d)); } catch (e) { return false; } });
    let n = 0;
    if (!done()) d.setDate(d.getDate() - 1);
    for (let i = 0; i < 400; i++) {
      if (done()) n++;
      else if (d.getDay() !== 0 && d.getDay() !== 6) break;
      d.setDate(d.getDate() - 1);
    }
    return n;
  };

  function setAccent(game) {
    const root = doc.documentElement.style;
    if (game && game.accent) { root.setProperty('--accent', game.accent[0]); root.setProperty('--accent-pale', game.accent[1]); }
    else { root.removeProperty('--accent'); root.removeProperty('--accent-pale'); }
  }
  const soundKey = () => shell.mode === 'board' ? 'sound.board' : 'sound.solo';
  function loadSound() { Lab.sound.on = !!Lab.store.get(soundKey(), shell.mode === 'board'); }
  function toggleSound() {
    Lab.sound.on = !Lab.sound.on;
    Lab.store.set(soundKey(), Lab.sound.on);
    shell.redock();
    const b = doc.getElementById('soundPill');
    if (b) b.focus();
  }

  function dock(items) {
    const nav = doc.getElementById('dock');
    nav.innerHTML = '';
    items.forEach(it => {
      if (it.brand) {
        const s = doc.createElement('span');
        s.className = 'brand';
        s.textContent = it.brand;
        nav.appendChild(s);
        return;
      }
      const b = doc.createElement('button');
      b.type = 'button';
      b.className = 'pill' + (it.pale ? ' pale' : '') + (it.round ? ' round' : '');
      if (it.id) b.id = it.id;
      if (it.html) b.innerHTML = it.html; else b.textContent = it.label;
      if (it.aria) b.setAttribute('aria-label', it.aria);
      if (it.pressed !== undefined) b.setAttribute('aria-pressed', String(it.pressed));
      b.addEventListener('click', it.onClick);
      nav.appendChild(b);
    });
  }
  function dockTail(game) {
    return [
      { round: true, pale: true, label: '?', aria: 'How to play', onClick: () => howTo(game) },
      { id: 'soundPill', round: true, pale: !Lab.sound.on, html: Lab.sound.on ? ICON.soundOn : ICON.soundOff, aria: 'Sound', pressed: Lab.sound.on, onClick: toggleSound }
    ];
  }
  function howTo(game) { Lab.sheet(game.howTo, { label: 'How to play', cls: 'howto' }); }

  function clearScreen() {
    Lab.closeSheet();
    if (shell.session && shell.session.unmount) shell.session.unmount();
    shell.session = null;
    shell.extras = [];
    const app = doc.getElementById('app');
    app.innerHTML = '';
    app.scrollTop = 0;
    return app;
  }

  function showHub() {
    shell.screen = 'hub'; shell.game = null; shell.mode = null;
    loadSound(); setAccent(null);
    const app = clearScreen();
    const date = Lab.today();
    const dailies = games.filter(g => g.modes.indexOf('daily') >= 0);
    let h = '<div class="hub"><header class="hub-head"><h1 class="hub-title">' + esc(HUB.name) + '</h1><p class="hub-tag">' + esc(HUB.tagline) + '</p></header>';
    if (dailies.length) {
      const streak = Lab.dailyStreak();
      h += '<section class="card today" aria-label="Daily puzzles"><p class="label">Daily · ' + esc(Lab.dateWords(date)) + '</p><div class="today-list">' +
        dailies.map(g => '<button class="btn daily-go" type="button" data-game="' + g.id + '">' + esc(g.name) +
          (g.dailyDone && g.dailyDone(date) ? '<span class="done" aria-label="done today">✓</span>' : '') + '</button>').join('') +
        '</div>' + (streak ? '<p class="today-streak">Streak <b>' + streak + '</b></p>' : '') + '</section>';
    }
    h += '<div class="games">' + games.map(g => '<button class="card gtile" type="button" data-game="' + g.id + '">' + g.icon +
      '<span class="gname">' + esc(g.name) + '</span></button>').join('') + '</div></div>';
    app.innerHTML = h;
    app.querySelectorAll('.gtile').forEach(b => b.addEventListener('click', () => showHome(byId(b.dataset.game))));
    app.querySelectorAll('.daily-go').forEach(b => b.addEventListener('click', () => showMode(byId(b.dataset.game), 'daily')));
    shell.redock = () => dock([{ brand: HUB.name }]);
    shell.redock();
  }

  function showHome(game) {
    shell.screen = 'home'; shell.game = game; shell.mode = null;
    loadSound(); setAccent(game);
    const app = clearScreen();
    const done = game.dailyDone && game.dailyDone(Lab.today());
    app.innerHTML = '<div class="home"><section class="card home-card" aria-label="' + esc(game.name) + '">' +
      '<h1 class="home-title" style="--chars:' + Math.max(...String(game.name).split(/\s+/).map(w => w.length)) + '">' + esc(game.name) + '</h1>' + (game.art || '') +
      '<div class="modes">' + game.modes.map(m => '<button class="btn' + (m === 'play' ? ' primary' : '') + '" type="button" data-mode="' + m + '">' +
        MODE_NAME[m] + (m === 'daily' && done ? '<span class="done" aria-label="done today">✓</span>' : '') + '</button>').join('') + '</div>' +
      '<button class="mini" type="button" data-howto>How to play</button></section></div>';
    app.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => showMode(game, b.dataset.mode)));
    app.querySelector('[data-howto]').addEventListener('click', () => howTo(game));
    shell.redock = () => dock((shell.single ? [] : [{ round: true, pale: true, html: ICON.back, aria: 'All games', onClick: showHub }]).concat(dockTail(game)));
    shell.redock();
  }

  function showMode(game, mode) {
    shell.screen = 'mode'; shell.game = game; shell.mode = mode;
    loadSound(); setAccent(game);
    const app = clearScreen();
    const host = doc.createElement('div');
    host.className = 'mode';
    app.appendChild(host);
    shell.redock = () => dock([{ round: true, pale: true, html: ICON.back, aria: 'Back', onClick: () => showHome(game) }, { brand: game.name }]
      .concat(shell.extras, dockTail(game)));
    shell.redock();
    const ctx = {
      mode,
      date: Lab.today(),
      setDock(extras) { shell.extras = extras || []; shell.redock(); },
      home: () => showHome(game)
    };
    shell.session = game.mount(mode, host, ctx) || null;
  }

  Lab.start = function (opts) {
    opts = opts || {};
    shell.single = opts.single ? byId(opts.single) : null;
    if (shell.single) showHome(shell.single); else showHub();
  };
  Lab._shell = shell; /* for the tests */
  Lab._games = games;
})(window);

(function () {
'use strict';
/* ===== Make 24: solver, rating, decks (no DOM) ===== */
const TARGET = 24;

/* ---- exact fractions ---- */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; }
function F(n, d) { if (d === undefined) d = 1; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; }
const fAdd = (a, b) => F(a.n * b.d + b.n * a.d, a.d * b.d);
const fSub = (a, b) => F(a.n * b.d - b.n * a.d, a.d * b.d);
const fMul = (a, b) => F(a.n * b.n, a.d * b.d);
const fDiv = (a, b) => F(a.n * b.d, a.d * b.n);
const fEq = (a, b) => a.n === b.n && a.d === b.d;
const fNum = a => a.n / a.d;
const fKey = a => a.d === 1 ? String(a.n) : a.n + '/' + a.d;
const isInt = a => a.d === 1;
function isTerminating(a) { let d = a.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1; }
function apply(op, a, b) {
  if (op === '+') return fAdd(a, b);
  if (op === '-') return fSub(a, b);
  if (op === '*') return fMul(a, b);
  if (b.n === 0) return null;
  return fDiv(a, b);
}

/* ---- parse "3", "-4", "1/2", "0.75", "1 1/2" ---- */
function parseValue(str) {
  let s = String(str).trim().replace(/−/g, '-');
  let m;
  /* powers: 2^3, 2^-3, (1/2)^-2, (-2)^3 */
  if ((m = s.match(/^(?:(\d+)|\(\s*(-?\d+(?:\s*\/\s*\d+)?)\s*\))\s*\^\s*\(?\s*(-?\d+)\s*\)?$/))) {
    const bp = parseValue(m[1] !== undefined ? m[1] : m[2]), e = +m[3];
    if (!bp || Math.abs(e) > 6) return null;
    const b = bp.v;
    if (b.n === 0 && e <= 0) return null;
    const f = e < 0 ? F(b.d, b.n) : b;
    let v = F(1);
    for (let i = 0; i < Math.abs(e); i++) v = fMul(v, f);
    if (Math.abs(v.n) > 1e6 || v.d > 1e6) return null;
    return { v, form: 'pow', base: b, exp: e };
  }
  if ((m = s.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/))) {
    if (+m[4] === 0) return null;
    const v = fAdd(F(+m[2]), F(+m[3], +m[4]));
    return { v: m[1] ? F(-v.n, v.d) : v, form: 'frac' };
  }
  if ((m = s.match(/^(-?\d+)\s*\/\s*(\d+)$/))) {
    if (+m[2] === 0) return null;
    const v = F(+m[1], +m[2]);
    return { v, form: isInt(v) ? 'int' : 'frac' };
  }
  if ((m = s.match(/^(-?)(\d*)\.(\d{1,4})$/))) {
    const den = Math.pow(10, m[3].length);
    const v = F((+(m[2] || 0)) * den + (+m[3]), den);
    return { v: m[1] ? F(-v.n, v.d) : v, form: isInt(v) ? 'int' : 'dec' };
  }
  if ((m = s.match(/^-?\d+$/))) return { v: F(+s), form: 'int' };
  return null;
}

/* ---- canonical form: flattens + − and × ÷ chains so reordered answers count once ---- */
function canon(node) {
  if (node.leaf !== undefined) return { t: 'L', v: node.v, leaf: node.leaf, key: fKey(node.v) };
  const hi = (node.op === '+' || node.op === '-');
  const up = [], down = [];
  (function walk(n, sign) {
    const same = n.leaf === undefined && ((n.op === '+' || n.op === '-') === hi);
    if (same) {
      walk(n.l, sign);
      walk(n.r, (n.op === '-' || n.op === '/') ? !sign : sign);
    } else {
      (sign ? up : down).push(canon(n));
    }
  })(node, true);
  const order = (a, b) => (fNum(b.v) - fNum(a.v)) || (a.key < b.key ? -1 : a.key > b.key ? 1 : 0);
  up.sort(order); down.sort(order);
  const key = (hi ? 'S(' : 'P(') + up.map(x => x.key).join(',') + '|' + down.map(x => x.key).join(',') + ')';
  return { t: hi ? 'S' : 'P', up, down, v: node.v, key };
}

/* ---- cost of one solution path: how hard is it to see? ---- */
const OP_COST = { '+': 1, '*': 1.2, '-': 1.6, '/': 2.6 };
function costOf(node, kind, isRoot) {
  if (node.leaf !== undefined) return 0;
  let c = costOf(node.l, kind, false) + costOf(node.r, kind, false);
  const one = x => x.n === 1 && x.d === 1;
  const trivial = ((node.op === '*' || node.op === '/') && one(node.r.v)) || (node.op === '*' && one(node.l.v));
  c += trivial ? 0.6 : OP_COST[node.op];
  if (!isRoot) {
    const v = node.v, mag = Math.abs(fNum(v));
    if (!isInt(v)) c += (kind === 'rational') ? 1.8 : 5;
    if (v.n < 0) c += (kind === 'signed') ? 0.8 : 2.5;
    if (v.n === 0) c += 2;
    if (mag > 24) c += 1;
    if (mag > 72) c += 1.5;
  }
  if (isRoot && (node.op === '/' ) && !isInt(node.r.v)) c += 1.5;
  return c;
}

/* ---- solve: every distinct way to reach 24 using each card once ---- */
function solve(cards, kind) {
  kind = kind || 'whole';
  const found = new Map();
  const start = cards.map((c, i) => ({ v: c.v, leaf: i }));
  const OPS = ['+', '*', '-', '/'];
  (function rec(list) {
    if (list.length === 1) {

  let fallback = null;
  for (let tries = 0; tries < 3000; tries++) {
    const cards = makeCards(shuffle(deck.deal(rnd), rnd));
    const key = handKey(cards);
    if (avoid && avoid.has(key)) continue;
    if (new Set(cards.map(c => fKey(c.v))).size === 1) continue;

    if (!res.count) continue;
    if (deck.kind !== 'rational' && res.fractional) continue; /* whole-number decks never need a fraction along the way */
    const lv = levelFor(res.score, deck);
    const puzzle = { deckId, kind: deck.kind, cards, key, level: lv, points: LEVEL_POINTS[lv], result: res };
    if (lv === want) return puzzle;
    if (!fallback) fallback = puzzle;

}

/* Rate a hand the teacher typed in. */
function customPuzzle(strs) {
  const cards = makeCards(strs);
  if (!cards || cards.length !== 4) return null;
  const hasFrac = cards.some(c => !isInt(c.v)), hasNeg = cards.some(c => c.v.n < 0);

  const res = solve(cards, kind);
