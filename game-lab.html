    function check() {
      if (S.over) return;
      if (!full()) { fx.nudge = true; renderBoard(); return; }
      if (sync() || S.over) return;
      const guess = S.entry.slice(), clue = addGuess(S, guess);
      S.entry = blankRow();
      fx.scored = S.history.length - 1; fx.fresh = -1;
      say('Guess ' + S.history.length + ': ' + clueWords(clue) + '.');
      if (S.over) { if (S.solved) Lab.sound.play('solve'); endRound(S.solved ? (S.hints ? 'helped' : 'clean') : 'shown'); }
      else { Lab.sound.play('step'); save(); }
      renderAll();
    }

    /* ---------- the end of a round: cracked, out of guesses, or shown ---------- */
    function endRound(outcome) {
      S.over = true; S.tips = []; fx.flip = true;
      S.endedAt = performance.now(); /* Next ignores a tap for a moment, so a double tap on Check can't skip the debrief */
      settle(outcome);
      const v = verdict();
      say(v[0] + (v[1] ? ', ' + v[1].toLowerCase() : '') + '. The code was ' + codeWords(S.secret) + '.');
    }
    /* A round's outcome is decided once. */
    function settle(outcome) {
      if (S.outcome) return;
      S.outcome = outcome;
      if (mode === 'play') {
        if (outcome === 'shown') S.streak = 0;
        else {
          S.solvedCount++; S.streak++;
          if (S.streak > S.best) { S.best = S.streak; Lab.store.set(ID + '.best', S.best); }
        }
      }
      if (daily) finishDaily();
      if (board) Lab.store.set(BOARD, null);
    }
    function show() {
      if (S.over) return;
      endRound('shown');
      renderAll();
    }
    /* Show me ends the day's Daily, or the class's round on the Board, so there it asks first. */
    function askShow() {
      if (S.over) return;
      if (!board && !(daily && !S.daily.replay)) return show();
      const sh = Lab.sheet('<h2>Show the code?</h2><p>' + (daily ? 'That ends today’s Daily, and it counts as shown.' : 'That ends this round.') + '</p>',
        { label: 'Show the code', done: 'Keep playing', extra: '<button class="btn" type="button" data-show>Show the code</button>' });
      sh.el.querySelector('[data-show]').addEventListener('click', () => { sh.close(true); show(); });
    }
    function next() {
      if (!S.over || performance.now() - S.endedAt < 500) return;
      if (daily) return showResults(S.daily.result, S.daily.replay);
      deal();
    }

    /* ---------- hints: how many codes fit, then a fact the clues prove, then a strong guess ---------- */
    function hint() {
      if (S.over || sync() || S.over) return;
      if (!addHint(S)) return;
      save();
      renderSide(); renderActions();
    }
    function tipHTML(t) {
      const n = S.codes.length;
      if (t.kind === 'count') return n === 1 ? 'Only <b>1</b> code fits every clue.' : '<b>' + num(n) + '</b> codes still fit every clue.';
      if (t.kind === 'fact') {
        if (!t.fact) return 'Make your next guess fit every clue so far.';
        const text = factText(t.fact, S.levelId, nameHTML), src = factSource(t.fact, S.levelId, S.history);
        return src < 0 ? text : text.replace(/\.$/, '') + ', because guess ' + (src + 1) + ' had ' + clueInline(S.history[src].clue) + '.';
      }
      const g = t.guess, lead = n === 1 ? 'It has to be' : S.history.length ? 'Try' : 'A strong start';
      const note = n === 1 ? '' : g.worst === 1 ? 'You’ll know the code after it.' : 'At most <b>' + num(g.worst) + '</b> codes will be left after it.';
      return '<span class="cb-try">' + lead + miniRow(g.code) + '<button class="mini" type="button" data-act="use">Use it</button></span>' +
        (note ? '<span class="cb-note">' + note + '</span>' : '');
    }

    /* ---------- rendering ---------- */
    function renderMeta() {
      const L = S.L, bits = [];
      if (daily) {
        bits.push('Daily');
        if (S.daily.replay) bits.push('Replay');
        bits.push(L.name, repeatsText(L), Lab.clock(elapsed()));
      } else if (mode === 'play') bits.push(L.name, repeatsText(L), 'Solved ' + S.solvedCount, 'Streak ' + S.streak);
      else bits.push('Code ' + S.count, L.name, repeatsText(L));
      q('.cb-meta').textContent = bits.join(' · ');
    }
    function renderBoard() {
      const L = S.L, a = document.activeElement;
      const focusSpot = a && a.classList && a.classList.contains('cb-slot') && host.contains(a) ? +a.dataset.spot : -1;
      const d = S.over && S.history.length ? debrief(S.levelId, S.history, S.solved) : null;
      /* every row keeps a place for its clue and its count of codes left, so nothing moves when they fill in */
      const rest = k => '<span class="cb-rest">' + ((board || S.over) && k >= 0 ? '<b>' + num(S.counts[k + 1]) + '</b> left' : '') + '</span>';
      const noClue = '<span class="cb-clue"></span>';
      let h = '<div class="cb-rows">';
      h += '<div class="cb-row cb-code"><span class="cb-num"></span>' +
        '<span class="cb-pegs" role="img" aria-label="' + (S.over ? 'The code: ' + codeWords(S.secret) : 'The hidden code') + '">' +
        S.secret.map((s, i) => S.over
          ? '<span class="cb-peg cb-shown' + (fx.flip ? ' cb-flip' : '') + '" style="--i:' + i + '">' + symSVG(s) + '</span>'
          : '<span class="cb-peg cb-hid">?</span>').join('') + '</span>' + noClue + rest(-1) + '</div>';
      for (let k = 0; k < L.guesses; k++) {
        const g = S.history[k];
        if (g) {
          const cls = (k === fx.scored ? ' cb-in' : '') + (S.solved && k === S.history.length - 1 ? ' cb-win' : '') +
            (d && d.best === k ? ' cb-best' : '') + (d && d.rows[k].broke >= 0 ? ' cb-broke' : '');
          h += '<div class="cb-row cb-done' + cls + '"><span class="cb-num">' + (k + 1) + '</span>' +
            '<span class="cb-pegs" role="img" aria-label="Guess ' + (k + 1) + ': ' + codeWords(g.guess) + '">' +
            g.guess.map(s => '<span class="cb-peg">' + symSVG(s) + '</span>').join('') + '</span>' + clueHTML(g.clue) + rest(k) + '</div>';
        } else if (k === S.history.length && !S.over) {
          const nextSpot = S.entry.indexOf(null);
          h += '<div class="cb-row cb-now' + (fx.nudge ? ' cb-shake' : '') + '"><span class="cb-num">' + (k + 1) + '</span><span class="cb-pegs">' +
            S.entry.map((s, i) => s === null
              ? '<span class="cb-peg cb-empty' + (i === nextSpot ? ' cb-next' : '') + '"></span>'
              : '<button class="cb-peg cb-slot' + (i === fx.fresh ? ' cb-pop' : '') + '" type="button" data-spot="' + i + '" aria-label="Spot ' + (i + 1) + ', ' +
                SYMBOLS[s] + '. Tap to take it back.">' + symSVG(s) + '</button>').join('') +
            '</span>' + noClue + rest(-1) + '</div>';
        } else {
          h += '<div class="cb-row cb-later"><span class="cb-num">' + (k + 1) + '</span><span class="cb-pegs">' +
            blankRow().map(() => '<span class="cb-peg"></span>').join('') + '</span>' + noClue + rest(-1) + '</div>';
        }
      }
      q('.cb-board').innerHTML = h + '</div>';
      root.classList.toggle('cb-over', S.over);
      root.style.setProperty('--ph-done', boardHeight(S.history.length + 1).toFixed(2));
      fx.fresh = -1; fx.scored = -1; fx.flip = false; fx.nudge = false;
      if (focusSpot >= 0) {
        const slots = host.querySelectorAll('.cb-slot');
        const again = host.querySelector('.cb-slot[data-spot="' + focusSpot + '"]') || slots[slots.length - 1];
        if (again) again.focus(); else stage.focus({ preventScroll: true });
      }
      /* on a screen too short for the whole board, keep the row being filled in view */
      const now = q('.cb-now');
      if (now && stage.scrollHeight > stage.clientHeight + 1) now.scrollIntoView({ block: 'nearest' });
    }
    function renderKeys() {
      const box = q('.cb-keys');
      if (box.children.length === S.L.syms) return;
      box.innerHTML = Array.from({ length: S.L.syms }, (_, s) => '<button class="cb-key" type="button" data-sym="' + s + '" aria-label="' + NAMES[s] + '">' +
        symSVG(s) + '<i aria-hidden="true">' + (s + 1) + '</i></button>').join('');
    }
    function debriefHTML() {
      if (!S.history.length) return '';
      const d = debrief(S.levelId, S.history, S.solved), last = S.history.length - 1;
      const row = (tag, body) => '<div class="cb-tip"><span class="label">' + tag + '</span><span class="cb-tip-body">' + body + '</span></div>';
      let h = '';
      if (d.best >= 0) {
        const r = d.rows[d.best], out = r.before - r.left;
        h += row('Best guess', '<span class="cb-gn">Guess ' + (d.best + 1) + '</span> ruled out <b>' + num(out) + ' of ' + num(r.before) +
          '</b> codes that were left (' + Math.floor(100 * out / r.before) + '%), the biggest share.');
      }
      if (d.settled >= 0 && (d.settled < last || !S.solved)) h += row('One left', 'After guess ' + (d.settled + 1) + ', only one code fit.');
      const broke = d.rows.map((r, k) => r.broke >= 0 ? k : -1).filter(k => k >= 0);
      if (broke.length) {
        const k = broke[0], r = d.rows[k];
        h += row('Clues', '<span class="cb-gn cb-gn-o">' + guessList(broke) + '</span> couldn’t have been the code. If ' + miniRow(S.history[k].guess) +
          ' were the code, guess ' + (r.broke + 1) + ' would have shown ' + clueInline(r.would) + ', not ' + clueInline(S.history[r.broke].clue) + '.');
      } else if (S.history.length > 1) h += row('Clues', 'Every guess fit all the clues before it.');
      return h;
    }
    /* [the big line, the small line under it] */
    function verdict() {
      const n = S.history.length;
      if (S.solved) return ['Cracked in ' + plural(n, 'guess', 'guesses'), S.hints ? 'With ' + plural(S.hints, 'hint', 'hints') : 'No hints'];
      return [n >= S.L.guesses ? 'Out of guesses' : 'Code shown', ''];
    }
    function renderSide() {
      const count = q('.cb-count');
      if (count) { count.hidden = S.over; q('.cb-count-n').textContent = num(S.codes.length); }
      q('.cb-reveal').innerHTML = S.over ? debriefHTML()
        : S.tips.map((t, i) => '<div class="cb-tip cb-hint"><span class="label">Hint ' + (i + 1) + '</span><span class="cb-tip-body">' + tipHTML(t) + '</span></div>').join('');
      q('.cb-keys').hidden = S.over;
      const v = q('.cb-verdict'), w = S.over ? verdict() : ['', ''];
      v.hidden = !S.over;
      v.innerHTML = Lab.esc(w[0]) + (w[1] ? '<span>' + Lab.esc(w[1]) + '</span>' : '');
    }
    function renderActions() {
      const a = document.activeElement, had = a && host.contains(a) && a.dataset ? a.dataset.act : null;
      const btn = (act, label, cls, off) => '<button class="btn' + (cls ? ' ' + cls : '') + '" type="button" data-act="' + act + '"' + (off ? ' disabled' : '') + '>' + label + '</button>';
      let h = '';
      if (!S.over) {
        h += btn('hint', 'Hint', '', S.rung >= ladderFor(board, S.history.length).length);
        h += btn('show', 'Show me');
        h += btn('check', 'Check', 'primary cb-go', !full());
      } else h += btn('next', daily ? 'See results' : 'Next code', 'primary cb-go');
      q('.cb-actions').innerHTML = h;
      if (had) {
        const again = q('.cb-actions [data-act="' + had + '"]:not(:disabled)');
        if (again) again.focus(); else stage.focus({ preventScroll: true });
      }
    }
    function syncCheck() { const c = q('[data-act="check"]'); if (c) c.disabled = !full(); }
    function say(text) { q('.cb-sr').textContent = text; }
    function renderAll() { renderMeta(); renderBoard(); renderSide(); renderActions(); }

    /* ---------- saving: the Daily in progress and the Board round, so leaving and coming back picks up there ---------- */
    const dailyWant = () => ({ board: false, level: 'medium', date: S.daily.date });
    const runNow = () => Object.assign(saveRound(S), { date: S.daily.date, ms: Math.min(Math.round(elapsed()), 864e5 - 1) });
    function save() {
      if (daily) {
        if (!S.daily || S.daily.replay || S.over) return;
        /* never write over what another tab saved: merge with it */
        Lab.store.set(RUN, mergeRuns(runNow(), readRun(Lab.store.get(RUN, null), dailyWant())));
      } else if (board) Lab.store.set(BOARD, S.over ? null : Object.assign(saveRound(S), { secret: S.secret.slice(), count: S.count }));
    }
    function resumeBoard() {
      const raw = Lab.store.get(BOARD, null);
      if (raw === null) return false;
      const run = readRun(raw, { board: true });
      const R = run && isCode(raw.secret, LEVELS[run.level]) && isInt(raw.count, 1, 1e6) ? loadRound(run, raw.secret, true) : null;
      if (!R || R.over) { Lab.store.set(BOARD, null); return false; }
      S.count = raw.count;
      begin(R, false);
      return true;
    }

    /* ---------- Daily ---------- */
    /* The clock counts only while the Daily is on screen and the tab is showing; it is saved with the progress. */
    function elapsed() { const d = S.daily; return d ? d.ms + (d.since === null ? 0 : performance.now() - d.since) : 0; }
    function pauseClock() { const d = S.daily; if (d && d.since !== null) { d.ms = elapsed(); d.since = null; } }
    function runClock() { const d = S.daily; if (d && d.since === null && !S.over && document.visibilityState !== 'hidden') d.since = performance.now(); }
    function startDaily(replay) {
      S.daily = { date: ctx.date, code: dailyFor(ctx.date), replay: !!replay, ms: 0, since: null, result: null };
      deal();
      if (!replay) {
        const raw = Lab.store.get(RUN, null), run = raw === null ? null : readRun(raw, dailyWant());
        if (run) adopt(run);
        else if (raw !== null) Lab.store.set(RUN, null); /* another day's, or unreadable */
      }
      runClock();
      renderMeta();
    }
    /* Take on a saved run: this tab's own after a reload, or one another tab got further with. */
    function adopt(run) {
      const entry = S.entry, ms = Math.max(elapsed(), run.ms);
      begin(loadRound(run, S.daily.code, false), false);
      if (entry.length === S.L.len) S.entry = entry;
      S.daily.ms = ms;
      if (S.daily.since !== null) S.daily.since = performance.now();
      if (S.over) endRound(S.solved ? (S.hints ? 'helped' : 'clean') : 'shown');
      renderAll();
    }
    /* Two tabs on one Daily: before acting, take on what the other one saved. Returns true when the other tab
       has already finished it, and this one turns into a replay with the day's result on top. */
    function sync() {
      if (!daily || !S.daily || S.daily.replay || S.over) return false;
      const date = S.daily.date, done = readResult(Lab.store.get(resultKey(date), null), date);
      if (done) { startDaily(true); showResults(done, false); return true; }
      const theirs = readRun(Lab.store.get(RUN, null), dailyWant());
      if (!theirs) return false;
      const mine = runNow(), m = mergeRuns(mine, theirs);
      if (m.guesses.length !== mine.guesses.length || m.hints !== mine.hints || m.rung !== mine.rung || m.facts.length !== mine.facts.length) adopt(m);
      else if (m.ms > mine.ms) { S.daily.ms = m.ms; if (S.daily.since !== null) S.daily.since = performance.now(); }
      return false;
    }
    function finishDaily() {
      const d = S.daily;
      pauseClock();
      d.result = { date: d.date, rows: S.history.map(h => h.clue.slice()), outcome: S.outcome, hints: S.hints,
        ms: Math.min(Math.round(d.ms), 864e5 - 1), len: S.L.len, limit: S.L.guesses };
      if (d.replay) return;
      /* the day's first finish stands: one made in another tab is never overwritten */
      if (readResult(Lab.store.get(resultKey(d.date), null), d.date)) d.replay = true;
      else Lab.store.set(resultKey(d.date), d.result);
      Lab.store.set(RUN, null);
    }
    function markRow(c, len) {
      let h = '';
      for (let i = 0; i < len; i++) h += i < c[0] ? MARK_RIGHT : i < c[0] + c[1] ? MARK_WRONG : MARK_NONE;
      return '<span class="cb-r-marks" role="img" aria-label="' + clueWords(c) + '">' + h + '</span>';
    }
    function showResults(result, replay) {
      const rows = result.rows, won = result.outcome !== 'shown', hints = result.hints;
      const body = '<div class="cb-r-rows">' + rows.map((c, i) => '<div class="cb-r-row' + (won && i === rows.length - 1 ? ' cb-r-win' : '') + '">' +
        '<span class="cb-r-n">' + (i + 1) + '</span>' + markRow(c, result.len) + '</div>').join('') + '</div>';
      const sh = Lab.results({
        game: 'Codebreaker',
        sub: 'Daily · ' + Lab.dateWords(result.date),
        replay: !!replay,
        streak: true,
        squares: [result.outcome],
        body,
        stats: [[(won ? rows.length : 'X') + ' of ' + result.limit, 'Guesses'], [Lab.clock(result.ms), 'Time'], [String(hints), hints === 1 ? 'Hint' : 'Hints']]
      }, { done: 'Done', onClose: ctx.home, extra: '<button class="btn" type="button" data-again>Play again</button>' });
      sh.el.querySelector('[data-again]').addEventListener('click', () => { sh.close(true); startDaily(true); });
    }

    /* ---------- setup (Play and Board): only New code applies it; Escape or a tap outside changes nothing ---------- */
    function levelInfo(id) {
      const L = LEVELS[id], ways = [];
      for (let i = 0; i < L.len; i++) ways.push(L.repeats ? L.syms : L.syms - i);
      return miniRow(Array.from({ length: L.syms }, (_, s) => s)) + '<p>' + L.len + ' spots · ' + repeatsText(L) + ' · ' + L.guesses + ' guesses</p>' +
        '<p class="cb-lv-n">' + ways.join(' × ') + ' = <b>' + num(allCodes(id).length) + '</b> possible codes</p>';
    }
    function openSetup() {
      const pick = board ? S.bLevel : S.level;
      let chosen = pick, apply = false;
      const chip = l => '<button class="chip" type="button" data-level="' + l + '" aria-pressed="' + (l === pick) + '">' + LEVELS[l].name + '</button>';
      const sh = Lab.sheet('<h2>Setup</h2><p class="label">Level</p><div class="chips" role="group" aria-label="Level">' + LEVEL_IDS.map(chip).join('') + '</div>' +
        '<div class="cb-lv">' + levelInfo(pick) + '</div>', {
        label: 'Setup', done: 'New code',
        onClose() {
          if (!apply) return;
          if (board) S.bLevel = chosen; else S.level = chosen;
          saveSettings();
          /* as in Make 24: leaving a round that already has guesses ends the streak */
          if (mode === 'play' && !S.over && S.history.length) S.streak = 0;
          deal();
        }
      });
      sh.el.addEventListener('click', e => {
        if (e.target.closest('[data-close]')) { apply = true; return; }
        const c = e.target.closest('.chip');
        if (!c) return;
        chosen = c.dataset.level;
        sh.el.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c ? 'true' : 'false'));
        sh.el.querySelector('.cb-lv').innerHTML = levelInfo(chosen);
      });
    }

    /* ---------- input ---------- */
    host.addEventListener('click', e => {
      const key = e.target.closest('.cb-key');
      if (key) return place(+key.dataset.sym);
      const slot = e.target.closest('.cb-slot');
      if (slot) return clearSpot(+slot.dataset.spot);
      const a = e.target.closest('[data-act]');
      if (!a || a.disabled) return;
      const act = a.dataset.act;
      if (act === 'check') check();
      else if (act === 'hint') hint();
      else if (act === 'show') askShow();
      else if (act === 'next') next();
      else if (act === 'use') { const t = S.tips.find(x => x.kind === 'guess'); if (t) useGuess(t.guess.code); }
    });
    /* Enter checks the guess (or goes on, once a round is over). A button reached with Tab answers Enter itself;
       a button that was tapped or clicked doesn't keep Enter from checking. Typing a symbol takes focus off any button.
       A held key's repeats are ignored, so holding Enter can't run past the end of a round. */
    let keyNav = false;
    const onPointer = () => { keyNav = false; };
    function typing() {
      const a = document.activeElement;
      if (a && a !== stage && a.tagName === 'BUTTON') stage.focus({ preventScroll: true });
    }
    function onKey(e) {
      if (e.key === 'Tab') { keyNav = true; return; }
      if (Lab.sheetOpen() || e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
      const k = e.key.toLowerCase();
      if (k.length === 1 && k >= '1' && k <= '9') { if (+k > S.L.syms || S.over) return; typing(); place(+k - 1); }
      else if (k === 'backspace' || k === 'delete') {
        if (S.over) return;
        if (!(document.activeElement && document.activeElement.classList.contains('cb-slot'))) typing();
        backspace();
      }
      else if (k === 'enter') {
        if (keyNav && e.target.closest && e.target.closest('button')) return;
        if (!e.repeat) { if (S.over) next(); else check(); }
      }
      else if (k === 'h') { if (!e.repeat) hint(); }
      else if (k === 'n') { if (e.repeat || !S.over) return; next(); }
      else return;
      e.preventDefault();
    }
    function onVisible() {
      if (document.visibilityState === 'hidden') { pauseClock(); save(); }
      else { runClock(); sync(); }
    }
    function onStorage() { if (daily && S.daily && !S.daily.replay && !S.over) sync(); }

    /* ---------- go: nothing saved can keep the game from opening ---------- */
    function go() {
      if (daily) {
        const raw = Lab.store.get(resultKey(ctx.date), null), done = readResult(raw, ctx.date);
        if (!done && raw !== null) Lab.store.set(resultKey(ctx.date), null);
        startDaily(!!done);
        if (done) showResults(done, false);
      } else if (!(board && resumeBoard())) deal();
    }
    try { go(); }
    catch (e) {
      Lab.closeSheet();
      if (daily || board) Lab.store.set(daily ? RUN : BOARD, null);
      try { if (daily) startDaily(!!readResult(Lab.store.get(resultKey(ctx.date), null), ctx.date)); else deal(); } catch (e2) { /* the screen stays as drawn */ }
    }
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', onPointer, true);
    if (daily) {
      document.addEventListener('visibilitychange', onVisible);
      window.addEventListener('storage', onStorage);
      tick = setInterval(() => { if (S.daily && !S.over && !Lab.sheetOpen()) renderMeta(); }, 1000);
    }
    if (!daily) ctx.setDock([{ label: 'Setup', onClick: openSetup }]);

    return {
      unmount() {
        pauseClock(); save();
        document.removeEventListener('keydown', onKey);
        document.removeEventListener('pointerdown', onPointer, true);
        document.removeEventListener('visibilitychange', onVisible);
        window.removeEventListener('storage', onStorage);
        clearInterval(tick);
      },
      state: S /* for the tests */
    };
  }

  const peg = s => '<span class="cb-art-peg">' + symSVG(s) + '</span>';
  Lab.register({
    id: ID,
    name: 'Codebreaker',
    modes: ['play', 'daily', 'board'],

      const el = q('.t48-eq'), g = S.game, e = g.lastMerge || 0;
      const key = e ? [S.gid, e, g.mergeAt, S.powers].join('|') : g.slides ? 'none' : 'tip';
      el.classList.toggle('t48-dim', !!e && g.mergeAt !== g.slides);
      if (key === eqKey) return;
      eqKey = key;
      if (!e) {
        el.innerHTML = g.slides ? '' : '<span class="t48-tip"><span class="t48-tip-touch">Swipe to slide the tiles</span><span class="t48-tip-keys">Use the arrow keys or swipe</span></span>';
        return;
      }
      el.innerHTML = '<span class="t48-sum" role="img" aria-label="' + eqSay(e, S.powers) + '">' + eqHTML(e, S.powers) + '</span>';
    }
    function endTitle() {
      if (S.end === 'won') return 'You made ' + tileHTML(challenge().goal, S.powers) + '!';
      if (S.end === 'out') return 'Out of slides';
      if (S.end === 'done') return S.game.slides >= DAILY_SLIDES ? DAILY_SLIDES + ' slides done' : 'Game over';
      return 'Game over';
    }
    function renderSide() {
      const g = S.game, ch = challenge();
      const bits = mode === 'daily' ? ['Daily', Lab.dateWords(S.daily.date)].concat(S.daily.replay ? ['Replay'] : [])
        : ch ? ['Challenge', ch.name] : ['Classic'];
      if (S.hints) bits.push('With hints');
      q('.t48-meta').textContent = bits.join(' · ');

      /* "Slides left" carries its own bar, in a neutral color, so it never reads as progress toward the goal */
      const stat = (label, value, left) => '<div class="t48-stat' + (left === undefined ? '' : ' t48-left') + '"><span class="label">' + label + '</span><b>' + value + '</b>' +
        (left === undefined ? '' : '<i class="t48-lbar"><i style="transform: scaleX(' + Math.max(0, Math.min(1, left)) + ')"></i></i>') + '</div>';
      let stats;
      if (mode === 'daily') stats = stat('Slides left', fmt(DAILY_SLIDES - g.slides), (DAILY_SLIDES - g.slides) / DAILY_SLIDES) + stat('Score', fmt(g.score));
      else if (ch) stats = stat('Goal', tileHTML(ch.goal, S.powers)) + stat('Slides left', fmt(Math.max(0, ch.limit - g.slides)), (ch.limit - g.slides) / ch.limit) + stat('Score', fmt(g.score));
      else if (onBoard) stats = stat('Score', fmt(g.score)) + stat('Slides', fmt(g.slides));
      else stats = stat('Score', fmt(g.score)) + stat('Best', fmt(Math.max(S.best, g.score)));
      q('.t48-stats').innerHTML = stats;

      const hint = S.hint && S.hint.at === g.slides ? S.hint : null;
      let info = '';
      if (S.end) info = '<p class="t48-end">' + endTitle() + '</p>';
      else if (hint) info = '<div class="t48-hint"><span class="label">Hint</span><p>' + arrow(hint.dir) + '<span><b>' + DIR_WORD[hint.dir] + '</b> ' + whyText(hint, S.powers) + '.</span></p></div>';
      q('.t48-info').innerHTML = info;

      const btn = (act, label, cls, off) => '<button class="btn' + (cls ? ' ' + cls : '') + '" type="button" data-act="' + act + '"' + (off ? ' disabled' : '') + '>' + label + '</button>';
      let acts;
      if (mode === 'daily') acts = S.end ? btn('results', 'See results', 'primary') : btn('hint', 'Hint', '', !canHint());
      else if (S.end) acts = btn('review', 'Review') + btn('new', 'New game', 'primary');
      else acts = btn('hint', 'Hint', '', !canHint()) + btn('new', 'New game');
      q('.t48-actions').innerHTML = acts;

      host.querySelectorAll('.t48-pad-btn').forEach(b => {
        b.disabled = !!S.end;
        b.classList.toggle('t48-pad-hint', !!hint && b.dataset.dir === hint.dir);
      });
    }
    function renderAll(r) { renderTiles(r); renderEq(); renderSide(); }

    /* ---------- the end of a game: what happened, and the slides that cost the most ---------- */
    /* One costly slide: the board after it beside the board after the better slide, the key tiles outlined and named. */
    function costHTML(rec, c) {
      const before = rebuild(rec.seed, rec.moves.slice(0, c.i - 1)).board, made = CH_DIR[rec.moves[c.i - 1]];
      const ended = rec.stuck && c.i === rec.moves.length;
      const h = explain(before, c.b, made);
      const mine = ended ? rebuild(rec.seed, rec.moves).board : slide(before, made).board, better = slide(before, c.b).board;
      const why = ended ? 'This slide ended the game.' : '<b>' + DIR_WORD[c.b] + '</b> ' + whyText(h, S.powers, true) + '.';
      return '<div class="t48-cost"><p class="label">Slide ' + fmt(c.i) + '</p><div class="t48-pair">' +
        '<figure>' + miniHTML(mine, S.powers, 'After your slide ' + made, ended ? [] : h.mark.b) + '<figcaption>You: ' + arrow(made) + '<b>' + DIR_WORD[made] + '</b></figcaption></figure>' +
        '<figure>' + miniHTML(better, S.powers, 'After a slide ' + c.b, ended ? [] : h.mark.a) + '<figcaption>Better: ' + arrow(c.b) + '<b>' + DIR_WORD[c.b] + '</b></figcaption></figure>' +
        '</div><p class="t48-why">' + why + '</p></div>';
    }
    function costsHTML(rec) {
      if (rec.waiting) return '<p class="t48-wait">Looking back over your slides…</p>';
      const list = picks(rec.costs);
      if (!list.length) return '<p class="t48-none">None. Every slide was close to what the look-ahead player would do.</p>';
      return list.map(c => costHTML(rec, c)).join('');
    }
    function fillCosts() {
      if (!review || !review.el.isConnected) return;
      review.rec.waiting = review.live && S.pending.length > 0;
      review.rec.costs = review.live ? S.costs : review.rec.costs;
      review.el.querySelector('.t48-costs').innerHTML = costsHTML(review.rec);
    }
    const rstat = (value, label) => '<div class="r-stat"><b>' + value + '</b><span>' + label + '</span></div>';
    /* rec: { title, bits, seed, moves, score, top, stuck, costs, waiting }; live: this session's game, still being looked at.
       On the Board it is big enough to read across a classroom. */
    function openReview(rec, live, opts) {
      const h = '<h2>' + rec.title + '</h2><p class="label">' + rec.bits.join(' · ') + '</p>' +
        '<div class="r-stats t48-rstats">' + rstat(fmt(rec.score), 'Score') + rstat(tileHTML(rec.top, S.powers), 'Biggest tile') + '</div>' +
        '<p class="label t48-costs-label">Slides that cost the most</p><div class="t48-costs">' + costsHTML(rec) + '</div>';
      const sh = Lab.sheet(h, Object.assign({ cls: 't48-sheet t48-review' + (onBoard ? ' t48-big' : ''), label: 'Review' }, opts));
      review = { el: sh.el, rec, live };
      return sh;
    }
    function liveRecord() {
      const g = S.game, ch = challenge();
      const bits = [mode === 'daily' ? 'Daily' : ch ? 'Challenge · ' + ch.name : 'Classic',
        ch && S.end === 'won' ? fmt(g.slides) + ' of ' + fmt(ch.limit) + ' slides' : plural(g.slides, 'slide')];
      if (S.hints) bits.push('With hints');
      return { title: endTitle(), bits, seed: g.seed, moves: g.moves, score: g.score, top: maxExp(g.board), stuck: isOver(g.board), costs: S.costs, waiting: S.pending.length > 0 };
    }
    /* After a game in Play or Board: Close keeps the final board on screen; New game starts over. */
    function openEnd() {
      if (!S.end || mode === 'daily') return;
      let pick = null;
      const sh = openReview(liveRecord(), true, {
        done: 'New game',
        extra: '<button class="btn" type="button" data-close data-keep>Close</button>',
        onClose() { review = null; if (pick === 'new') freshGame(); }
      });
      sh.el.addEventListener('click', e => { const b = e.target.closest('[data-close]'); if (b) pick = b.hasAttribute('data-keep') ? 'keep' : 'new'; });
    }
    /* Classic: a 2048 tile. Keep going, or start a new game. */
    function celebrate() {
      if (S.end || Lab.sheetOpen()) return;
      /* Keep going is the button that has focus, so Enter never ends the game by accident */
      const sh = Lab.sheet('<h2>You made ' + tileHTML(GOAL, S.powers) + '!</h2>' + (S.hints ? '<p class="label">With hints</p>' : '') +
        '<div class="r-stats t48-rstats">' + rstat(fmt(S.game.score), 'Score') + rstat(fmt(S.game.slides), 'Slides') + '</div>', {
        cls: 't48-sheet t48-cheer', label: 'You made 2048', done: 'Keep going',
        extra: '<button class="btn" type="button" data-new>New game</button>'
      });
      sh.el.querySelector('[data-new]').addEventListener('click', () => { sh.close(true); freshGame(); });
    }
    /* New game asks first once a game is under way. */
    function askNew() {
      if (mode === 'daily' || Lab.sheetOpen()) return;
      if (S.end || S.game.slides < 10) return freshGame();
      let pick = null;
      const sh = Lab.sheet('<h2>Start a new game?</h2>', {
        cls: 't48-sheet', label: 'New game', done: 'New game',
        extra: '<button class="btn" type="button" data-close data-keep>Keep playing</button>',
        onClose() { if (pick === 'new') freshGame(); }
      });
      sh.el.addEventListener('click', e => { const b = e.target.closest('[data-close]'); if (b) pick = b.hasAttribute('data-keep') ? 'keep' : 'new'; });
    }

    /* ---------- Daily ---------- */
    function startDaily(replay, clean) {
      const date = ctx.date, seed = dailySeed(date);
      S.daily = { date, seed, replay: !!replay };
      S.result = null;
      const run = replay || clean ? null : storedRun();
      begin(run ? run.g : newGame(seed), run);
      if (!S.look && !S.lookRun) S.lookRun = lookaheadRun(seed, DAILY_SLIDES);
      wake();
      if (S.end && !replay && recordDaily()) endTimer = setTimeout(finishDaily, 0);
    }
    function lookDone() {
      S.look = S.lookRun.result();
      const key = resultKey(S.daily.date), stored = Lab.store.get(key, null);
      /* the same tiles give every tab the same score, so it may join any finished result for today */
      if (isResult(stored, S.daily.date) && !cleanLook(stored.look)) { stored.look = S.look; Lab.store.set(key, stored); }
      if (S.result && !S.result.look) S.result.look = S.look;
      const vs = document.querySelector('.t48-results .t48-vs');
      if (vs) showVs(vs, S.look);
    }
    /* Records the finished Daily, unless another tab finished first: the first result stands, and this tab becomes a
       replay showing it (null comes back). A replay is never recorded. */
    function recordDaily() {
      if (S.result) return S.result;
      const g = S.game, d = S.daily;
      const res = { date: d.date, seed: d.seed, moves: g.moves, score: g.score, top: maxExp(g.board), slides: g.slides, stuck: isOver(g.board),
        hints: S.hints, costs: S.costs.slice(), look: S.look };
      if (!d.replay) {
        const raw = Lab.store.get(resultKey(d.date), null);
        if (isResult(raw, d.date)) { becomeReplay(readResult(raw, d.date)); return null; }
        const run = storedRun();
        if (run && run.hints > res.hints) res.hints = S.hints = run.hints;
        Lab.store.set(resultKey(d.date), res);
        Lab.store.set(RUN, null);
      }
      S.result = res;
      return res;
    }
    function finishDaily() {
      if (!S.end) return;
      const res = recordDaily();
      if (res) showResults(res, S.daily.replay, true);
    }
    /* "Look-ahead player: 2,004", and a cheer when the student beats it */
    function showVs(el, look) {
      const score = +el.dataset.score;
      if (!look) { el.innerHTML = 'Look-ahead player: <b>…</b>'; return; }
      const beat = score > look.score;
      el.classList.toggle('t48-beat', beat);
      el.innerHTML = 'Look-ahead player: <b>' + fmt(look.score) + '</b>' +
        (beat ? '<span class="t48-won">You beat it!</span>' : score === look.score ? '<span class="t48-won">You tied it!</span>' : '');
      if (beat && el.dataset.live === '1' && !el.dataset.cheered) { el.dataset.cheered = '1'; Lab.sound.play('solve'); }
    }
    function showResults(res, replay, live) {
      const g = rebuild(res.seed, res.moves), top = maxExp(g.board);
      const sub = 'Daily · ' + Lab.dateWords(res.date) + (g.slides < DAILY_SLIDES ? ' · ' + plural(g.slides, 'slide') : '') + (res.hints ? ' · with hints' : '');
      const sh = Lab.results({
        game: '2048', sub, replay: !!replay, streak: true,
        body: miniHTML(g.board, S.powers, 'Final board'),
        stats: [[fmt(g.score), 'Score'], [String(VALUE[top]), 'Biggest tile']]
      }, {
        cls: 'results t48-sheet t48-results' + (replay ? ' replay' : ''), done: 'Done', onClose: ctx.home,
        extra: '<button class="btn" type="button" data-review>Review</button><button class="btn" type="button" data-again>Play again</button>'
      });
      if (S.powers) sh.el.querySelectorAll('.r-stat b')[1].innerHTML = tileHTML(top, true);
      const vs = document.createElement('p');
      vs.className = 't48-vs';
      vs.dataset.score = g.score;
      vs.dataset.live = live ? '1' : '0';
      sh.el.querySelector('.r-stats').after(vs);
      showVs(vs, res.look || S.look);
      sh.el.querySelector('[data-again]').addEventListener('click', () => { sh.close(true); startDaily(true); });
      sh.el.querySelector('[data-review]').addEventListener('click', () => {
        sh.close(true);
        const mine = S.result === res;
        openReview({
          title: g.slides >= DAILY_SLIDES ? DAILY_SLIDES + ' slides done' : 'Game over',
          bits: ['Daily', plural(g.slides, 'slide')].concat(res.hints ? ['With hints'] : []),
          seed: res.seed, moves: g.moves, score: g.score, top, stuck: isOver(g.board),
          costs: mine ? S.costs : res.costs || [], waiting: mine && S.pending.length > 0
        }, mine, { done: 'Back', onClose() { review = null; showResults(res, replay, false); } });
      });
    }

    /* ---------- setup: the game (Play and Board) and the tiles (every mode). Only Done applies it. ---------- */
    function openSetup() {
      const daily = mode === 'daily';
      const chosen = { kind: daily ? null : kind(), level: level(), powers: S.powers };
      const chip = (group, value, label, on) => '<button class="chip" type="button" data-group="' + group + '" data-value="' + value + '" aria-pressed="' + on + '">' + label + '</button>';
      let h = '<h2>Setup</h2>';
      if (!daily) {
        h += '<p class="label">Game</p><div class="chips" role="group" aria-label="Game">' +
          chip('kind', 'classic', 'Classic', chosen.kind === 'classic') + chip('kind', 'challenge', 'Challenge', chosen.kind === 'challenge') + '</div>' +
          '<div class="t48-levels"' + (chosen.kind === 'challenge' ? '' : ' hidden') + '><p class="label">Level</p><div class="chips" role="group" aria-label="Level">' +
          CHALLENGE_ORDER.map(l => chip('level', l, CHALLENGES[l].name, l === chosen.level)).join('') + '</div><p class="t48-goal"></p></div>';
      }
      h += '<p class="label">Tiles</p><div class="chips" role="group" aria-label="Tiles">' +
        chip('powers', '0', 'Numbers <span class="t48-chipx">32</span>', !chosen.powers) +
        chip('powers', '1', 'Powers <span class="t48-chipx">' + sup(5) + '</span>', chosen.powers) + '</div>';
      let done = false; /* Escape and a tap outside cancel */
      const sh = Lab.sheet(h, { cls: 't48-sheet t48-setup', label: 'Setup', onClose() { if (done) apply(); } });
      const goalLine = () => {
        const p = sh.el.querySelector('.t48-goal');
        if (p) { const c = CHALLENGES[chosen.level]; p.innerHTML = 'Make ' + tileHTML(c.goal, chosen.powers) + ' within ' + fmt(c.limit) + ' slides.'; }
      };
      goalLine();
      sh.el.addEventListener('click', e => {
        if (e.target.closest('.sheet-foot [data-close]')) { done = true; return; }
        const c = e.target.closest('.chip');
        if (!c) return;
        const g = c.dataset.group;
        chosen[g] = g === 'powers' ? c.dataset.value === '1' : c.dataset.value;
        sh.el.querySelectorAll('.chip[data-group="' + g + '"]').forEach(x => x.setAttribute('aria-pressed', x === c ? 'true' : 'false'));
        const lv = sh.el.querySelector('.t48-levels');
        if (lv) lv.hidden = chosen.kind !== 'challenge';
        goalLine();
      });
      function apply() {
        const tiles = chosen.powers !== S.powers;
        const switched = !daily && (chosen.kind !== kind() || (chosen.kind === 'challenge' && chosen.level !== level()));
        if (switched) save(); /* the game being left stays saved under its own kind and level */
        S.powers = chosen.powers;
        if (!daily) {
          if (onBoard) { S.bKind = chosen.kind; S.bLevel = chosen.level; } else { S.kind = chosen.kind; S.level = chosen.level; }
        }
        saveSettings();
        if (switched) resume();
        else if (tiles) renderAll(null);
      }
    }

    /* ---------- input ---------- */
    host.addEventListener('click', e => {
      const pad = e.target.closest('.t48-pad-btn');
      if (pad) { if (e.detail) pad.blur(); return doSlide(pad.dataset.dir); } /* a tap leaves no ring that could pass for a hint */
      const a = e.target.closest('[data-act]');
      if (!a || a.disabled) return;
      const act = a.dataset.act;
      if (act === 'hint') hintNow();
      else if (act === 'new') askNew();
      else if (act === 'review') openEnd();
      else if (act === 'results') finishDaily();
    });
    function onKey(e) {
      if (Lab.sheetOpen() || e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
      const k = (e.key || '').toLowerCase(), dir = KEY_DIR[k];
      if (dir) { e.preventDefault(); if (!e.repeat) doSlide(dir); return; }
      if (k === 'h') hintNow();
      else if (k === 'n') askNew();
      else return;
      e.preventDefault();
    }
    /* Swipes on the board, by touch or mouse: one finger at a time. A second touch is ignored until the first lifts,
       so two fingers make one slide. touch-action: none (game.css) keeps the page still. */
    const play = q('.t48-play');
    let sw = null;
    function swipeDir(e, min) {
      const dx = e.clientX - sw.x, dy = e.clientY - sw.y, ax = Math.abs(dx), ay = Math.abs(dy);
      if (Math.max(ax, ay) < min || Math.abs(ax - ay) < min * 0.3) return null;
      return ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    }
    const swipeMin = () => Math.max(14, q('.t48-board').clientWidth * 0.05);
    play.addEventListener('pointerdown', e => {
      if (sw) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      sw = { id: e.pointerId, x: e.clientX, y: e.clientY, used: false };
      try { play.setPointerCapture(e.pointerId); } catch (err) { /* fine without it */ }
    });
    play.addEventListener('pointermove', e => {
      if (!sw || sw.id !== e.pointerId || sw.used) return;
      const dir = swipeDir(e, swipeMin());
      if (dir) { sw.used = true; doSlide(dir); }
    });
    function lift(e) { /* only the tracked finger's own lift or cancel ends a swipe */
      if (!sw || sw.id !== e.pointerId) return;
      if (e.type === 'pointerup' && !sw.used) { const dir = swipeDir(e, swipeMin() * 0.6); if (dir) doSlide(dir); }
      sw = null;
    }
    window.addEventListener('pointerup', lift);
    window.addEventListener('pointercancel', lift);
    /* for browsers without touch-action: a swipe on the board never scrolls the page */
    play.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });

    ctx.setDock([{ label: 'Setup', onClick: openSetup }]);

    /* ---------- go: a damaged save is read as absent, and nothing here may stop the game from opening ---------- */
    function start() {
      if (mode === 'daily') {
        const done = readResult(Lab.store.get(resultKey(ctx.date), null), ctx.date);
        if (done && done.look) S.look = done.look;
        startDaily(!!done);
        if (done) showResults(done, false, false);
      } else resume();
    }
    try { start(); }
    catch (err) {
      console.error(err);
      Lab.closeSheet();
      try { if (mode === 'daily') startDaily(false, true); else freshGame(); } catch (err2) { console.error(err2); }
    }
    document.addEventListener('keydown', onKey);
    window.addEventListener('storage', onStorage);

    return {
      unmount() {
        dead = true;
        document.removeEventListener('keydown', onKey);
        window.removeEventListener('storage', onStorage);
        window.removeEventListener('pointerup', lift);
        window.removeEventListener('pointercancel', lift);
        clearTimeout(endTimer);
        if (idleId) cic(idleId);
      },
      state: S, /* for the tests */
      bot: () => lookMove(S.game.board), /* for the browser check: the look-ahead player's slide */
      redraw: () => { eqKey = ''; renderAll(null); } /* for the browser check: draws S.game.board as it stands */
    };
  }

  const THEN = '<svg class="t48-then" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5.5 6.5 6.5L9 18.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const exRow = row => '<span class="t48-mini t48-exrow" role="img" aria-label="' + row.map(e => e ? VALUE[e] : 'empty').join(', ') + '">' + row.map(e => e ? '<span class="' + tileClass(e) + '" data-d="d1">' + VALUE[e] + '</span>' : '<span></span>').join('') + '</span>';

  Lab.register({
    id: ID,
    name: '2048',
    modes: ['play', 'daily', 'board'],
    accent: ['#5FD3A4', '#DDF6EC'],
    icon: '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="#E6D5B8"/><rect x="34" y="2" width="28" height="28" rx="7" fill="#8FE5DC"/>' +
      '<rect x="2" y="34" width="28" height="28" rx="7" fill="#127A85"/><rect x="34" y="34" width="28" height="28" rx="7" fill="#F2B640"/>' +
      '<g font-family="DM Sans, sans-serif" font-weight="900" text-anchor="middle"><text x="16" y="22.5" font-size="16" fill="#17324D">2</text><text x="48" y="22.5" font-size="16" fill="#17324D">4</text>' +
      '<text x="16" y="54.5" font-size="16" fill="#fff">8</text><text x="48" y="51.8" font-size="10.5" fill="#17324D">2048</text></g></svg>',
    art: '<div class="t48-art" aria-hidden="true"><span class="t48-e10">1024</span><i>+</i><span class="t48-e10">1024</span><i>=</i><span class="t48-e11">2048</span></div>',
    howTo: '<h2>How to play</h2><p>Swipe, or use the arrow keys, to slide all the tiles. Two tiles with the same number merge into one worth double.</p>' +
      '<div class="t48-howto-ex"><span class="t48-howto-step">Slide left twice:</span>' + exRow([1, 1, 2, 0]) + THEN + exRow([2, 2, 0, 0]) + THEN + exRow([3, 0, 0, 0]) + '</div>' +
      '<p>A tile merges once per slide, so the new 4 waits for the next slide. Make a <b>2048</b> tile before the board fills up.</p>' +
      '<p><b>Powers</b> shows 32 as ' + sup(5) + '. Two ' + sup(5) + ' tiles are 2 · ' + sup(5) + ', which is ' + sup(1) + ' · ' + sup(5) +
        '. To multiply powers with the same base, add the exponents: ' + sup(1) + ' · ' + sup(5) + ' = ' + sup('1+5') + ' = ' + sup(6) + '.</p>' +
      '<p><b>Hint</b> shows the slide the look-ahead player would make. <b>Challenge</b> gives you a slide limit. <b>Daily</b> is 150 slides, the same tiles for everyone today.</p>' +
      '<p class="t48-keys">Keys: arrows or <b>W A S D</b> slide · <b>H</b> hint · <b>N</b> new game</p>',
    dailyDone: date => isResult(Lab.store.get(ID + '.daily.' + date, null), date),
    daily: dailyGame,
    saved: { result: readResult, game: readGame, isResult, decide: dailyDecision, key: saveKey }, /* for the tests */
    mount
  });
})();

})();
Lab.start();
</script>
