/* Game Lab kit. The look is Make 24's: a Deckhand board with no title strips — white cards with hard sand
   shadows on the cream grid, one navy dock bottom-left, the sea along the bottom. Coral is for alerts only.
   Each game sets --accent / --accent-pale; Make 24's accent is the board turquoise. */
:root {
  --cream: #F8F2E4; --grid: #EADFC6; --sand: #E6D5B8; --shadow: #D8C5A0;
  --turq: #40E0D0; --paleturq: #D8F6F1; --teal: #127A85;
  --navy: #17324D; --coral: #FF7F6A; --white: #FFFFFF;
  --turq-light: #BFEFEA; --turq-mid: #8FE5DC; --coral-deep: #E85F4A; --coral-pale: #FFC2B5;
  --accent: var(--turq); --accent-pale: var(--paleturq);
  --sans: "DM Sans", system-ui, sans-serif;
  --gap: clamp(12px, 1.5vw, 28px);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; font-size: clamp(15px, 0.6vw + 0.9vh, 24px); }
body {
  margin: 0; height: 100%; overflow: hidden;
  font-family: var(--sans); color: var(--navy); line-height: 1.3; -webkit-text-size-adjust: 100%;
  background-color: var(--cream);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 48px 48px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
/* touch panels and Chromebooks: every control answers a finger by pressing in */
.btn:active:not(:disabled), .mini:active, .pill:active, .chip:active, .gtile:active { transform: translateY(1px) scale(.97); }

/* ---------- frame ---------- */
.app {
  position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; overflow: auto;
  padding: var(--gap) var(--gap) clamp(76px, 9vh, 98px);
}
.card { background: var(--white); border-radius: 20px; box-shadow: 8px 10px 0 var(--shadow); min-width: 0; }
.label { margin: 0; color: var(--teal); font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }

/* ---------- controls ---------- */
.btn { border: 0; border-radius: 999px; background: var(--paleturq); color: var(--navy); font-weight: 700; font-size: 1rem; padding: .65rem 1.3rem; min-height: 2.75rem; white-space: nowrap; }
.btn.primary { background: var(--accent); font-weight: 900; }
.btn.sand { background: var(--sand); }
.btn:disabled { opacity: .4; cursor: default; }
.mini { border: 0; border-radius: 999px; background: var(--sand); color: var(--navy); font-weight: 700; font-size: .85rem; padding: .3rem .85rem; min-height: 2rem; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chip { background: var(--paleturq); color: var(--navy); border: 0; border-radius: 999px; font-weight: 700; font-size: 14px; padding: 0 14px; min-height: 40px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); font-weight: 900; }

/* ---------- dock: the one chrome bar ---------- */
#dock {
  position: fixed; left: var(--gap); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 15;
  max-width: calc(100% - 2 * var(--gap)); display: flex; align-items: center; gap: 8px;
  background: var(--navy); border-radius: 999px; box-shadow: 4px 6px 0 var(--shadow); padding: 7px;
}
#dock:empty { display: none; }
.brand { margin: 0 6px 0 10px; color: var(--turq); font-weight: 900; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.pill { background: var(--turq); color: var(--navy); border: 0; font-weight: 700; font-size: 13px; padding: 10px 16px; min-height: 40px; border-radius: 999px; white-space: nowrap; }
.pill.pale { background: var(--paleturq); }
.pill.round { width: 40px; padding: 0; display: grid; place-items: center; font-weight: 900; font-size: 18px; line-height: 1; flex: none; }
.pill svg { width: 20px; height: 20px; display: block; }
#dock :focus-visible { outline-color: var(--white); }
@media (max-width: 460px) { #dock .brand { display: none; } #dock:has(> .brand:only-child) { display: none; } }

/* ---------- the sea ---------- */
#waves { position: fixed; left: 0; bottom: 0; width: 100%; height: clamp(44px, 8vh, 88px); z-index: 0; pointer-events: none; display: block; }
.wvSand { fill: var(--sand); } .wvLight { fill: var(--turq-light); } .wvMid { fill: var(--turq-mid); }

/* ---------- sheets: how to play, setup, results ---------- */
.sheet-back {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: var(--gap);
  background: rgba(23, 50, 77, .28); animation: fade .15s ease;
}
.sheet { width: min(34rem, 100%); max-height: 100%; overflow: auto; padding: clamp(1rem, 3vh, 1.6rem) clamp(1rem, 3vw, 1.8rem); display: flex; flex-direction: column; gap: .8rem; outline: none; }
.sheet h2 { margin: 0; font-size: 1.45rem; font-weight: 900; line-height: 1.15; }
.sheet p { margin: 0; }
.sheet .label { margin-top: .3rem; }
.sheet-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .6rem; margin-top: .3rem; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- results card: made to be screenshotted ---------- */
.results { align-items: center; text-align: center; gap: .7rem; }
.r-game { font-weight: 900; font-size: 2rem; line-height: 1; }
.r-sub { color: var(--teal); font-weight: 700; }
.r-squares { display: flex; flex-wrap: wrap; justify-content: center; gap: .55rem; margin: .3rem 0; }
.r-sq { width: clamp(2.6rem, 9vh, 3.6rem); aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; font-weight: 900; font-size: 1.35rem; color: var(--navy); }
.r-sq.clean { background: var(--accent); }
.r-sq.helped { background: var(--accent-pale); box-shadow: inset 0 0 0 3px var(--accent); }
.r-sq.shown { background: var(--sand); }
.r-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem 1.8rem; }
.r-stat b { display: block; font-size: 1.7rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
.r-stat span { color: var(--teal); font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }
.r-key { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .3rem .9rem; font-size: .8rem; font-weight: 500; color: var(--teal); }
.r-key i { font-style: normal; display: inline-flex; align-items: center; gap: .35rem; }
.r-key .r-sq { width: 1.35rem; font-size: .75rem; border-radius: 5px; }
.r-key .r-sq.helped { box-shadow: inset 0 0 0 2px var(--accent); }
.results .sheet-foot { justify-content: center; }

/* ---------- hub ---------- */
.hub { display: flex; flex-direction: column; gap: var(--gap); }
.today { padding: .9rem 1.1rem; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; }
.today-list { display: flex; flex-wrap: wrap; gap: .5rem; }
.today .done { font-weight: 900; margin-left: .2rem; }
.today-streak { margin: 0 0 0 auto; color: var(--teal); font-weight: 700; white-space: nowrap; }
.today-streak b { color: var(--navy); font-weight: 900; font-variant-numeric: tabular-nums; }
.hub-head { display: flex; flex-direction: column; gap: .3rem; padding: clamp(.2rem, 1vh, .6rem) .3rem 0; }
.hub-title { margin: 0; font-weight: 900; font-size: clamp(2.1rem, 6.5vh, 3.6rem); line-height: 1; letter-spacing: -.01em; }
.hub-tag { margin: 0; color: var(--teal); font-weight: 700; font-size: clamp(1rem, 2.3vh, 1.3rem); }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr)); gap: var(--gap); align-content: start; }
.gtile { border: 0; padding: clamp(1.2rem, 4.5vh, 2.4rem) 1rem clamp(1rem, 3.5vh, 1.9rem); display: flex; flex-direction: column; align-items: center; gap: clamp(.7rem, 2vh, 1.1rem); color: var(--navy); }
.gtile svg { width: clamp(4.5rem, 17vh, 8rem); height: auto; display: block; }
.gname { font-weight: 900; font-size: 1.35rem; }

/* ---------- a game's own front page ---------- */
.home { flex: 1; display: grid; place-items: center; min-height: 0; }
.home-card { width: min(40rem, 100%); padding: clamp(1.2rem, 4.5vh, 2.6rem) clamp(1.2rem, 4vw, 3rem); display: flex; flex-direction: column; align-items: center; gap: clamp(.9rem, 2.8vh, 1.7rem); text-align: center; }
.home-title { margin: 0; font-weight: 900; font-size: clamp(2.4rem, 7.5vh, 4.4rem); line-height: 1; letter-spacing: -.01em; }
.modes { display: flex; flex-wrap: wrap; justify-content: center; gap: .7rem; }
.modes .btn { min-width: 8.5rem; font-size: 1.15rem; padding: .85rem 1.6rem; min-height: 3.2rem; }
.modes .done { margin-left: .35rem; font-weight: 900; }

@media (max-width: 560px) {
  .card { border-radius: 16px; box-shadow: 5px 6px 0 var(--shadow); }
  .modes .btn { min-width: 7rem; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== Codebreaker ===== */
.cb-host { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.cb { --ph: var(--ph-all); flex: 1; display: flex; flex-direction: column; min-height: 0; }
.cb-stage { container-type: inline-size; flex: 1; display: flex; flex-direction: column; gap: clamp(.55rem, 1.6vh, 1.1rem); padding: clamp(.9rem, 2.2vh, 1.5rem) clamp(.9rem, 2vw, 1.9rem) clamp(.9rem, 2.2vh, 1.6rem); min-height: 0; outline: none; }
.cb-top { display: flex; align-items: center; min-height: 1.1rem; }
.cb-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: clamp(1rem, 3vw, 3.5rem); }
.cb-m-board .cb-main { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
.cb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: 0; }

/* ---------- the board: the code on top, then a row per guess. The pegs fit the space the board gets:
   game.js sets --pw and --ph-all, the board's width and height measured in pegs. ---------- */
.cb-field { container-type: size; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
.cb-board { display: flex; justify-content: center; }
.cb-rows { --peg: min(calc(100cqw / var(--pw)), calc(100cqh / var(--ph)), 6.5rem); display: flex; flex-direction: column; }
.cb-m-board .cb-rows { --peg: min(calc(100cqw / var(--pw)), calc(100cqh / var(--ph)), 7.5rem); }
.cb-row { display: flex; align-items: center; gap: calc(var(--peg) * .35); padding: calc(var(--peg) * .1) calc(var(--peg) * .25); border-radius: calc(var(--peg) * .34); }
.cb-num { flex: none; width: calc(var(--peg) * .7); height: calc(var(--peg) * .62); display: grid; place-items: center; border-radius: 999px; color: var(--teal); font-weight: 700; font-size: calc(var(--peg) * .34); font-variant-numeric: tabular-nums; }
.cb-pegs { display: flex; gap: calc(var(--peg) * .14); }
.cb-peg { position: relative; flex: none; width: var(--peg); height: var(--peg); border: 0; padding: 0; border-radius: calc(var(--peg) * .24); background: var(--cream); display: grid; place-items: center; color: var(--navy); }
.cb-peg .cb-sym { width: 70%; height: 70%; display: block; }
.cb-code { margin-bottom: calc(var(--peg) * .25); }
.cb-hid { background: var(--navy); color: var(--accent); font-weight: 900; font-size: calc(var(--peg) * .5); box-shadow: calc(var(--peg) * .05) calc(var(--peg) * .06) 0 var(--shadow); }
.cb-shown { background: var(--accent-pale); box-shadow: calc(var(--peg) * .05) calc(var(--peg) * .06) 0 var(--shadow); }
.cb-later .cb-peg { background: transparent; box-shadow: inset 0 0 0 2px var(--cream); }
.cb-later .cb-num { opacity: .55; }
.cb-now { background: var(--accent-pale); }
.cb-now .cb-num { color: var(--navy); font-weight: 900; }
.cb-now .cb-peg { background: var(--white); }
.cb-empty { box-shadow: inset 0 0 0 2px var(--sand); }
.cb-empty.cb-next { box-shadow: inset 0 0 0 3px var(--navy); }
.cb-slot { cursor: pointer; }
.cb-slot:active { transform: scale(.94); }
.cb-win { background: var(--accent); }
.cb-win .cb-peg { background: var(--white); }
.cb-win .cb-num { color: var(--navy); font-weight: 900; }
/* after the round: the best guess's number sits on gold, a guess that broke a clue has its number ringed (a guess can be both) */
.cb-best .cb-num, .cb-gn { background: var(--accent); color: var(--navy); font-weight: 900; }
.cb-broke .cb-num { color: var(--navy); font-weight: 900; box-shadow: inset 0 0 0 2px var(--navy); }
.cb-gn-o { background: transparent; box-shadow: inset 0 0 0 2px var(--navy); }
.cb-gn { display: inline-block; padding: 0 .55em; border-radius: 999px; line-height: 1.45; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* clue marks, each with its count: ● right symbol, right spot · ○ right symbol, wrong spot */
.cb-clue { flex: none; width: calc(var(--peg) * 2.1); display: flex; align-items: center; gap: calc(var(--peg) * .26); font-size: calc(var(--peg) * .5); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.cb-mk { display: inline-flex; align-items: center; gap: .16em; }
.cb-mk-i { width: .78em; height: .78em; display: block; flex: none; }
.cb-mk.cb-zero { opacity: .4; }
.cb-rest { flex: none; width: calc(var(--peg) * 2.6); color: var(--teal); font-weight: 700; font-size: calc(var(--peg) * .3); white-space: nowrap; }
.cb-rest b { color: var(--navy); font-weight: 900; font-size: 1.45em; font-variant-numeric: tabular-nums; margin-right: .2em; }

/* one-shot motion */
.cb-pop { animation: cb-pop .22s cubic-bezier(.34, 1.56, .64, 1); }
.cb-in .cb-clue { animation: cb-rise .32s ease both; }
.cb-flip { animation: cb-flip .5s cubic-bezier(.3, .7, .4, 1) both; animation-delay: calc(var(--i) * 90ms); }
.cb-shake .cb-pegs { animation: cb-shake .3s ease; }
@keyframes cb-pop { from { transform: scale(.7); } to { transform: none; } }
@keyframes cb-rise { from { opacity: 0; transform: translateX(-.4em); } to { opacity: 1; transform: none; } }
@keyframes cb-flip { from { transform: perspective(30em) rotateY(90deg); } to { transform: none; } }
@keyframes cb-shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* ---------- the side: codes left (Board), the key to the marks, hints or the debrief, the symbols ---------- */
.cb-side { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: clamp(.6rem, 1.8vh, 1.1rem); }
.cb-count { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: var(--accent-pale); border-radius: 16px; padding: clamp(.6rem, 1.6vh, 1rem) clamp(.9rem, 1.4vw, 1.4rem); }
.cb-count-n { margin: 0; font-weight: 900; font-size: clamp(2.2rem, 9vh, 6rem); line-height: 1; font-variant-numeric: tabular-nums; }
.cb-legend { flex: none; display: flex; flex-wrap: wrap; gap: .3rem 1.4rem; color: var(--teal); font-weight: 700; font-size: .85rem; }
.cb-legend span { display: inline-flex; align-items: center; gap: .4rem; }
.cb-legend svg { width: 1.05em; height: 1.05em; color: var(--navy); flex: none; }
.cb-reveal { background: var(--cream); border-radius: 14px; padding: .75rem 1rem; display: flex; flex-direction: column; gap: .6rem; font-size: 1.05rem; font-weight: 500; min-width: 0; min-height: 0; overflow: auto; flex: 0 1 auto; }
.cb-reveal:empty { display: none; }
.cb-tip { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .7rem; }
.cb-tip > .label { flex: none; width: 6.2rem; }
.cb-tip-body { flex: 1; min-width: min(100%, 12rem); line-height: 1.45; }
.cb-tip b { font-weight: 900; }
.cb-nm { white-space: nowrap; }
.cb-sym-in { width: 1.05em; height: 1.05em; display: inline-block; vertical-align: -.16em; margin-right: .22em; }
.cb-try { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .4rem .6rem; margin-right: .5rem; }
.cb-try .mini { background: var(--accent); }
.cb-note { display: block; margin-top: .3rem; color: var(--teal); font-size: .92em; }
.cb-chain { display: inline-flex; flex-wrap: wrap; align-items: center; gap: .3rem .35rem; }
.cb-step { background: var(--white); border-radius: 999px; padding: .12rem .7rem; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cb-arrow { color: var(--teal); font-weight: 700; }
.cb-grow { flex: 1; min-height: 0; }

.cb-keys { flex: none; display: grid; grid-template-columns: repeat(var(--syms), minmax(0, 1fr)); gap: clamp(.35rem, .9vw, .8rem); width: 100%; max-width: calc(var(--syms) * 5.6rem); align-self: center; padding: 0 6px 6px 0; }
.cb-key { position: relative; aspect-ratio: 1; min-height: 2.6rem; border: 0; padding: 0; border-radius: 22%; background: var(--cream); box-shadow: 3px 4px 0 var(--shadow); display: grid; place-items: center; }
.cb-key svg { width: 62%; height: 62%; display: block; }
.cb-key i { position: absolute; top: 7%; left: 11%; font-style: normal; font-weight: 700; font-size: clamp(.62rem, 1.1vh, .8rem); color: var(--teal); }
.cb-key:active { transform: translateY(2px) scale(.95); box-shadow: 1px 2px 0 var(--shadow); }
@media (hover: none), (pointer: coarse) { .cb-key i { display: none; } }
.cb-verdict { flex: none; margin: 0; text-align: center; font-weight: 900; font-size: clamp(1.5rem, 4.6vh, 2.8rem); line-height: 1.1; text-wrap: balance; }
.cb-verdict span { display: block; margin-top: .45rem; color: var(--teal); font-weight: 700; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; }

.cb-actions { flex: none; display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.cb-actions .cb-go { margin-left: auto; min-width: 9rem; padding: .8rem 2rem; font-size: 1.1rem; }
.cb-m-board .cb-reveal { font-size: 1.2rem; }

/* ---------- small pieces: a row of symbols (hints, setup, how to play) and the results card's rows ---------- */
.cb-minis { display: inline-flex; gap: .25em; vertical-align: middle; }
.cb-mini { width: 1.75em; height: 1.75em; border-radius: .42em; background: var(--cream); display: grid; place-items: center; flex: none; }
.cb-mini .cb-sym { width: 70%; height: 70%; display: block; }
.cb-tip .cb-mini { background: var(--white); }
.cb-r-rows { display: flex; flex-direction: column; align-items: center; gap: .35rem; margin: .1rem 0 .2rem; }
.cb-r-row { display: flex; align-items: center; gap: .5rem; }
.cb-r-n { width: 1.2rem; text-align: right; color: var(--teal); font-weight: 700; font-size: .8rem; font-variant-numeric: tabular-nums; }
.cb-r-marks { display: flex; gap: .35rem; padding: .32rem .5rem; border-radius: 10px; background: var(--cream); color: var(--navy); }
.cb-r-win .cb-r-marks { background: var(--accent); }
.cb-r-marks .cb-mk-i { width: 1.4rem; height: 1.4rem; }
.cb-mk-none { opacity: .4; }

/* ---------- setup and how to play ---------- */
.cb-lv { display: flex; flex-direction: column; gap: .5rem; background: var(--cream); border-radius: 14px; padding: .75rem 1rem; }
.cb-lv p { font-weight: 700; color: var(--teal); font-size: .92rem; }
.cb-lv .cb-minis { font-size: 1.15rem; flex-wrap: wrap; }
.cb-lv .cb-mini { background: var(--white); }
.howto ol { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: .25rem; font-weight: 500; }
.cb-howto-key { display: flex; flex-wrap: wrap; gap: .2rem 1.2rem; margin-top: .25rem; font-weight: 700; }
.cb-howto-key span { display: inline-flex; align-items: center; gap: .4rem; }
.cb-howto-key svg { width: 1.05em; height: 1.05em; flex: none; }
.cb-howto-ex { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: .45rem .8rem; background: var(--cream); border-radius: 14px; padding: .75rem 1rem; }
.cb-howto-ex .cb-mini { background: var(--white); }
.cb-howto-ex .cb-clue { --peg: 2.5rem; width: auto; }
.cb-howto-keys { font-size: .85rem; font-weight: 500; color: var(--teal); }
.cb-howto-keys b { color: var(--navy); }
@media (hover: none), (pointer: coarse) { .cb-howto-keys { display: none; } }

/* ---------- front page: the art, and a title that fits a phone ---------- */
.home-card:has(.cb-art) .home-title { font-size: min(clamp(2.4rem, 7.5vh, 4.4rem), 12.5vw); }
.cb-art { display: flex; gap: clamp(.4rem, 1.2vw, .7rem); }
.cb-art-peg { width: clamp(2.8rem, 8.5vh, 4rem); aspect-ratio: 1; border-radius: 12px; background: var(--cream); display: grid; place-items: center; box-shadow: 3px 4px 0 var(--shadow); }
.cb-art-peg .cb-sym { width: 66%; height: 66%; display: block; }
.cb-art-hid { background: var(--navy); color: var(--accent); font-weight: 900; font-size: clamp(1.4rem, 4.2vh, 2.1rem); }

/* ---------- portrait screens and phones: one column, the board on top. The board gives way to hints down to
   a floor, and once a round is over its empty rows go, so the debrief has room. ---------- */
@media (max-width: 760px), (max-aspect-ratio: 1/1) {
  .cb.cb-over { --ph: var(--ph-done); }
  .cb-over .cb-later { display: none; }
  .cb-over .cb-verdict { order: -1; }
  .cb-main, .cb-m-board .cb-main { display: flex; flex-direction: column; gap: clamp(.55rem, 1.6vh, 1rem); }
  .cb-field { flex: 1000 1 0; min-height: min(30vh, calc(100cqw * var(--ph) / var(--pw))); max-height: calc(100cqw * var(--ph) / var(--pw)); }
  .cb-verdict { font-size: 1.6rem; }
  .cb-side { flex: 1 1 auto; gap: clamp(.5rem, 1.4vh, .9rem); }
  .cb-reveal { font-size: 1rem; padding: .6rem .8rem; }
  .cb-tip > .label { width: 100%; }
  .cb-count { padding: .4rem .9rem; }
  .cb-count-n { font-size: 2.2rem; }
  .cb-legend { font-size: .78rem; gap: .2rem 1rem; justify-content: center; }
  .cb-actions .btn { padding-inline: 1.1rem; }
  .cb-actions .cb-go { min-width: 0; padding-inline: 1.7rem; font-size: 1.05rem; }
}

</style>
</head>
<body>
<svg id="waves" viewBox="0 0 1920 120" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0,55 C240,25 480,85 720,55 C960,25 1200,85 1440,55 C1680,25 1820,70 1920,50 L1920,120 L0,120 Z" class="wvSand"/>
  <path d="M0,84 L1920,84 L1920,120 L0,120 Z" class="wvLight"/>
  <path d="M0,104 L1920,104 L1920,120 L0,120 Z" class="wvMid"/>
</svg>
<main class="app" id="app"></main>
<nav id="dock" aria-label="Game controls"></nav>
<script>
/* ===== Game Lab kit: storage, daily seeds, sound, sheets, results card, dock and screens =====
   Every game registers with Lab.register() and only touches the element it is mounted in.
   Nothing here talks to the network, and nothing about a student is ever asked for or kept. */
(function (global) {
  'use strict';
  const doc = global.document;
  const Lab = global.Lab = {};
  const pad2 = n => String(n).padStart(2, '0');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  Lab.esc = esc;

  /* ---------- storage: this browser only; every call survives storage being blocked or wiped ---------- */
  const PREFIX = 'gamelab.';
  Lab.store = {
    get(key, fallback) {
      try { const raw = global.localStorage.getItem(PREFIX + key); return raw === null ? fallback : JSON.parse(raw); }
      catch (e) { return fallback; }
    },
    set(key, value) {
      try { global.localStorage.setItem(PREFIX + key, JSON.stringify(value)); return true; }
      catch (e) { return false; }
    }
  };

  /* ---------- seeded randomness: a Daily is the same puzzle on every device that day ---------- */
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  Lab.hash = hash;
  Lab.rng = seed => mulberry32(typeof seed === 'string' ? hash(seed) : seed);
  const isoOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  Lab.today = () => isoOf(new Date());
  Lab.dailyRng = (gameId, date) => Lab.rng(gameId + '|daily|' + (date || Lab.today()));
  Lab.dateWords = function (iso) {
    const p = iso.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  };
  Lab.clock = function (ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ':' + pad2(s % 60);
  };

  /* ---------- sound: off by default for solo play (a room of Chromebooks), on for the board ---------- */
  let actx = null;
  const TONES = {
    solve: { type: 'sine', gain: .22, seq: [[523, 0], [659, .09], [784, .18], [1047, .27]] },
    up: { type: 'triangle', gain: .22, seq: [[660, 0], [660, .24], [440, .48]] },
    step: { type: 'sine', gain: .07, seq: [[740, 0]] }
  };
  Lab.sound = {
    on: false,
    play(kind) {
      const tone = TONES[kind];
      if (!this.on || !tone) return;
      try {
        const AC = global.AudioContext || global.webkitAudioContext;
        if (!AC) return;
        actx = actx || new AC();
        if (actx.state === 'suspended') actx.resume();
        const now = actx.currentTime;
        tone.seq.forEach(([f, t]) => {
          const o = actx.createOscillator(), g = actx.createGain();
          o.type = tone.type;
          o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, now + t);
          g.gain.exponentialRampToValueAtTime(tone.gain, now + t + .02);
          g.gain.exponentialRampToValueAtTime(0.0001, now + t + .34);
          o.connect(g); g.connect(actx.destination);
          o.start(now + t); o.stop(now + t + .4);
        });
      } catch (e) { /* no audio here: play on silently */ }
    }
  };

  /* ---------- sheets ---------- */
  let openSheet = null;
  Lab.sheetOpen = () => !!openSheet;
  Lab.closeSheet = () => { if (openSheet) openSheet.close(true); };
  Lab.sheet = function (inner, opts) {
    opts = opts || {};
    if (openSheet) openSheet.close(true);
    const back = doc.createElement('div');
    back.className = 'sheet-back';
    back.innerHTML = '<div class="card sheet' + (opts.cls ? ' ' + opts.cls : '') + '" role="dialog" aria-modal="true" aria-label="' +
      esc(opts.label || 'Dialog') + '" tabindex="-1">' + inner + '<div class="sheet-foot">' + (opts.extra || '') +
      '<button class="btn primary" type="button" data-close>' + esc(opts.done || 'Done') + '</button></div></div>';
    const box = back.firstElementChild;
    const before = doc.activeElement;
    function close(silent) {
      if (!back.isConnected) return;
      back.remove();
      doc.removeEventListener('keydown', onKey, true);
      if (openSheet && openSheet.el === box) openSheet = null;
      if (!silent && opts.onClose) opts.onClose();
      if (!silent && before && before.isConnected && before.focus) before.focus();
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); return; }
      if (e.key === 'Tab') { /* keep focus inside the sheet */
        const f = Array.from(box.querySelectorAll('button:not(:disabled), [href], input, select, [tabindex]:not([tabindex="-1"])'));
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && doc.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && doc.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    back.addEventListener('click', e => { if (e.target === back || e.target.closest('[data-close]')) close(); });
    doc.addEventListener('keydown', onKey, true);
    doc.body.appendChild(back);
    (box.querySelector('[data-close]') || box).focus({ preventScroll: true });
    openSheet = { el: box, close };
    return openSheet;
  };

  /* ---------- results card ---------- */
  const SQ = {
    clean: ['✓', 'solved without hints'],
    helped: ['✓', 'solved with hints'],
    shown: ['–', 'answer shown']
  };
  /* r: { game, sub, squares?: ['clean' | 'helped' | 'shown'], body?: html of the game's own, stats: [[value, label]], key?: false } */
  Lab.results = function (r, opts) {
    const sq = r.squares || [];

/* ===== Codebreaker: the Game Lab edition =====
   Play, Daily and Board on engine.js. The computer hides a row of symbols; after each guess the clue counts
   ● the right symbol in the right spot and ○ the right symbol in a different spot. */
(function () {
  'use strict';
  const ID = 'codebreaker';
  const num = n => Number(n).toLocaleString('en-US');
  const NAMES = SYMBOLS.map(s => s[0].toUpperCase() + s.slice(1));
  /* Each symbol is its own shape and its own color. The shape alone tells them apart; there is no coral. */
  const FILLS = ['#2F7FE0', '#17324D', '#2A9D5C', '#8A5BD6', '#F2B640', '#19ADA0', '#A26B3B'];
  const EDGES = ['#2F7FE0', '#17324D', '#2A9D5C', '#8A5BD6', '#D99A1E', '#19ADA0', '#A26B3B'];
  const SHAPES = [
    '<circle cx="50" cy="50" r="41"/>',
    '<rect x="14" y="14" width="72" height="72" rx="7"/>',
    '<path d="M50 9 94 86H6z"/>',
    '<path d="M50 4 90 50 50 96 10 50z"/>',
    '<path d="M50 7 62 37.4 94.7 39.5 69.5 60.3 77.6 92 50 74.5 22.4 92 30.5 60.3 5.3 39.5 38 37.4z"/>',
    '<path d="M50 7 87.2 28.5 87.2 71.5 50 93 12.8 71.5 12.8 28.5z"/>',
    '<path d="M37 8h26v29h29v26H63v29H37V63H8V37h29z"/>'
  ];
  function symSVG(s, cls) {
    return '<svg class="' + (cls || 'cb-sym') + '" viewBox="0 0 100 100" aria-hidden="true"><g fill="' + FILLS[s] + '" stroke="' + EDGES[s] +
      '" stroke-width="5" stroke-linejoin="round">' + SHAPES[s] + '</g></svg>';
  }
  /* clue marks: a filled dot and a ring, each with its count, so the marks differ by shape as well as by fill */
  const MARK_RIGHT = '<svg class="cb-mk-i" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="currentColor"/></svg>';
  const MARK_WRONG = '<svg class="cb-mk-i" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>';
  const MARK_NONE = '<svg class="cb-mk-i cb-mk-none" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6" fill="currentColor"/></svg>';
  const clueWords = c => c[0] + ' right symbol' + (c[0] === 1 ? '' : 's') + ' in the right spot, ' + c[1] + ' in a wrong spot';
  const clueHTML = c => '<span class="cb-clue" role="img" aria-label="' + clueWords(c) + '">' +
    '<span class="cb-mk' + (c[0] ? '' : ' cb-zero') + '">' + MARK_RIGHT + '<b>' + c[0] + '</b></span>' +
    '<span class="cb-mk' + (c[1] ? '' : ' cb-zero') + '">' + MARK_WRONG + '<b>' + c[1] + '</b></span></span>';
  const codeWords = code => code.map(s => SYMBOLS[s]).join(', ');
  const miniRow = code => '<span class="cb-minis">' + code.map(s => '<span class="cb-mini">' + symSVG(s) + '</span>').join('') + '</span>';
  /* a symbol's name in a sentence, with its shape beside it */
  const nameHTML = (s, many) => '<b class="cb-nm">' + symSVG(s, 'cb-sym-in') + (many ? PLURALS : SYMBOLS)[s] + '</b>';
  const repeatsText = L => L.repeats ? 'Repeats allowed' : 'No repeats';
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

  /* The Daily: one Medium code for everyone that day (engine.js dailyCode). */
  const dailyMemo = [];
  const dailyFor = date => dailyCode(date, iso => Lab.dailyRng(ID, iso), dailyMemo);

  /* ---------- one session of a mode ---------- */
  function mount(mode, host, ctx) {
    const saved = Lab.store.get(ID + '.settings', {}) || {};
    const isLevel = l => LEVEL_IDS.indexOf(l) >= 0;
    const board = mode === 'board';
    const S = {
      level: isLevel(saved.level) ? saved.level : 'easy',
      bLevel: isLevel(saved.bLevel) ? saved.bLevel : 'medium',
      L: null, secret: [], history: [], entry: [], codes: [], counts: [],
      rung: 0, hints: 0, facts: [], tips: [],
      over: false, solved: false, outcome: null,
      count: 0, solvedCount: 0, streak: 0, best: +Lab.store.get(ID + '.best', 0) || 0,
      daily: null
    };
    /* one-shot motion: the symbol just placed, the row just scored, the code turning over, a row that isn't full */
    const fx = { fresh: -1, scored: -1, flip: false, nudge: false };
    /* Board always shows how many codes are left, so its ladder starts at the fact */
    const ladder = board ? ['fact', 'guess'] : ['count', 'fact', 'guess'];
    let tick = 0;
    const q = sel => host.querySelector(sel);
    const saveSettings = () => Lab.store.set(ID + '.settings', { level: S.level, bLevel: S.bLevel });
    const blankRow = () => new Array(S.L.len).fill(null);
    const full = () => S.entry.indexOf(null) < 0;

    host.classList.add('cb-host');
    host.innerHTML =
      '<div class="cb cb-m-' + mode + '">' +
        '<section class="card cb-stage" aria-label="Codebreaker" tabindex="-1">' +
          '<div class="cb-top"><p class="label cb-meta"></p></div>' +
          '<div class="cb-main">' +
            '<div class="cb-field"><div class="cb-board"></div></div>' +
            '<div class="cb-side">' +
              (board ? '<div class="cb-count"><p class="label">Codes left</p><p class="cb-count-n"></p></div>' : '') +
              '<div class="cb-legend" aria-hidden="true"><span>' + MARK_RIGHT + 'Right symbol, right spot</span><span>' + MARK_WRONG + 'Right symbol, wrong spot</span></div>' +
              '<div class="cb-reveal" aria-live="polite"></div>' +
              '<div class="cb-grow"></div>' +
              '<div class="cb-keys" role="group" aria-label="Symbols"></div>' +
              '<p class="cb-verdict" hidden></p>' +
            '</div>' +
          '</div>' +
          '<div class="cb-actions"></div>' +
          '<p class="cb-sr" aria-live="polite"></p>' +
        '</section>' +
      '</div>';
    const root = q('.cb'), stage = q('.cb-stage');

    /* ---------- dealing ---------- */
    function deal() {
      const levelId = mode === 'daily' ? 'medium' : board ? S.bLevel : S.level;
      S.L = LEVELS[levelId];
      S.secret = mode === 'daily' ? S.daily.code.slice() : randomCode(levelId, Math.random);
      S.history = []; S.entry = blankRow(); S.codes = allCodes(levelId); S.counts = [S.codes.length];
      S.rung = 0; S.hints = 0; S.facts = []; S.tips = [];
      S.over = false; S.solved = false; S.outcome = null; S.count++;
      fx.fresh = -1; fx.scored = -1; fx.flip = false;
      sizeBoard(); renderKeys(); renderAll();
    }
    /* The board's size in peg widths and heights, for game.css to fit the pegs to the space (it matches the rows' CSS).
       --ph-done is the height of just the code and the guesses made: phones drop the empty rows once a round is over. */
    const rowsHigh = rows => (rows * 1.2 + 0.35).toFixed(2);
    function sizeBoard() {
      const L = S.L;
      const pw = 0.5 + 0.7 + 0.35 + L.len + (L.len - 1) * 0.14 + 0.35 + 2.1 + (board ? 0.35 + 2.6 : 0) + 0.1;
      root.style.setProperty('--pw', pw.toFixed(2));
      root.style.setProperty('--ph-all', rowsHigh(L.guesses + 1));
    }

    /* ---------- entering a guess ---------- */
    function place(s) {
      if (S.over || s < 0 || s >= S.L.syms) return;
      const i = S.entry.indexOf(null);
      if (i < 0) { fx.nudge = true; renderBoard(); return; }
      S.entry[i] = s; fx.fresh = i;
      renderBoard(); syncCheck();
    }
    function clearSpot(i) {
      if (S.over || S.entry[i] === null || S.entry[i] === undefined) return;
      S.entry[i] = null;
      renderBoard(); syncCheck();
    }
    /* Backspace takes back the spot that has focus, or else the last one filled. */
    function backspace() {
      if (S.over) return;
      const a = document.activeElement;
      if (a && a.classList.contains('cb-slot') && host.contains(a)) return clearSpot(+a.dataset.spot);
      for (let i = S.entry.length - 1; i >= 0; i--) if (S.entry[i] !== null) { S.entry[i] = null; renderBoard(); syncCheck(); return; }
    }
    function useGuess(code) {
      if (S.over || !code) return;
      S.entry = code.slice(); fx.fresh = -1;
      renderBoard(); syncCheck();
    }
    function check() {
      if (S.over) return;
      if (!full()) { fx.nudge = true; renderBoard(); return; }
      const guess = S.entry.slice(), clue = score(S.secret, guess);
      S.history.push({ guess, clue });
      S.codes = filterCodes(S.codes, guess, clue);
      S.counts.push(S.codes.length);
      S.entry = blankRow(); S.rung = 0; S.tips = [];
      fx.scored = S.history.length - 1; fx.fresh = -1;
      say('Guess ' + S.history.length + ': ' + clueWords(clue) + '.');
      if (clue[0] === S.L.len) { S.solved = true; Lab.sound.play('solve'); endRound(S.hints ? 'helped' : 'clean'); }
      else if (S.history.length >= S.L.guesses) endRound('shown');
      else { Lab.sound.play('step'); saveRun(); }
      renderAll();
    }

    /* ---------- the end of a round: cracked, out of guesses, or shown ---------- */
    function endRound(outcome) {
      S.over = true; S.tips = []; fx.flip = true;
      settle(outcome);
      const v = verdict();
      say(v[0] + (v[1] ? ', ' + v[1].toLowerCase() : '') + '. The code was ' + codeWords(S.secret) + '.');
    }
    /* A round's outcome is decided once. */
    function settle(outcome) {
      if (S.outcome) return;
      S.outcome = outcome;
      if (mode === 'play') {
        if (outcome === 'shown') S.streak = 0;
        else {
          S.solvedCount++; S.streak++;
          if (S.streak > S.best) { S.best = S.streak; Lab.store.set(ID + '.best', S.best); }
        }
      }
      if (mode === 'daily') finishDaily();
    }
    function show() {
      if (S.over) return;
      endRound('shown');
      renderAll();
    }
    /* On the day's Daily, Show me ends the Daily for good, so it asks first. */
    function askShow() {
      if (S.over) return;
      if (mode !== 'daily' || S.daily.replay) return show();
      const sh = Lab.sheet('<h2>Show the code?</h2><p>That ends today’s Daily, and it counts as shown.</p>',
        { label: 'Show the code', done: 'Keep playing', extra: '<button class="btn" type="button" data-show>Show the code</button>' });
      sh.el.querySelector('[data-show]').addEventListener('click', () => { sh.close(true); show(); });
    }
    function next() {
      if (!S.over) return;
      if (mode === 'daily') return showResults(S.daily.result, S.daily.replay);
      deal();
    }

    /* ---------- hints: how many codes fit, then a fact the clues prove, then a strong guess ---------- */
    function hint() {
      if (S.over || S.rung >= ladder.length) return;
      const kind = ladder[S.rung++];
      S.hints++;
      const tip = { kind };
      if (kind === 'fact' && S.history.length) {
        tip.fact = pickFact(S.codes, S.L.id, S.history, S.facts);
        if (tip.fact) S.facts.push(tip.fact);
      }
      if (kind === 'guess') tip.guess = strongGuess(S.codes, S.L.id, S.history);
      S.tips.push(tip);
      saveRun();
      renderSide(); renderActions();
    }
    function tipHTML(t) {
      const n = S.codes.length;
      if (t.kind === 'count') {
        if (!S.history.length) return 'Any of the <b>' + num(n) + '</b> codes could be the one.';
        return n === 1 ? 'Only <b>1</b> code fits every clue.' : '<b>' + num(n) + '</b> codes still fit every clue.';
      }
      if (t.kind === 'fact') {
        if (!S.history.length) return 'No clues yet, so any guess is a good start.';
        return t.fact ? factText(t.fact, S.L.id, nameHTML) : 'Make your next guess fit every clue so far.';
      }
      const g = t.guess, lead = n === 1 ? 'It has to be' : S.history.length ? 'Try' : 'A strong start';
      const note = n === 1 ? '' : g.worst === 1 ? 'Whatever the clue, you’ll know the code after it.' :
        'Whatever the clue, no more than <b>' + num(g.worst) + '</b> codes will be left.';
      return '<span class="cb-try">' + lead + miniRow(g.code) + '<button class="mini" type="button" data-act="use">Use it</button></span>' +
        (note ? '<span class="cb-note">' + note + '</span>' : '');
    }

    /* ---------- rendering ---------- */
    function renderMeta() {
      const L = S.L, bits = [];
      if (mode === 'daily') {
        bits.push('Daily');
        if (S.daily.replay) bits.push('Replay');
        bits.push(L.name, repeatsText(L), Lab.clock((S.daily.end || Date.now()) - S.daily.start));
      } else if (mode === 'play') bits.push(L.name, repeatsText(L), 'Solved ' + S.solvedCount, 'Streak ' + S.streak);
      else bits.push('Code ' + S.count, L.name, repeatsText(L));
      q('.cb-meta').textContent = bits.join(' · ');
    }
    function renderBoard() {
      const L = S.L, a = document.activeElement;
      const focusSpot = a && a.classList && a.classList.contains('cb-slot') && host.contains(a) ? +a.dataset.spot : -1;
      const d = S.over && S.history.length ? debrief(L.id, S.history, S.solved) : null;
      let h = '<div class="cb-rows">';
      h += '<div class="cb-row cb-code"><span class="cb-num"></span>' +
        '<span class="cb-pegs" role="img" aria-label="' + (S.over ? 'The code: ' + codeWords(S.secret) : 'The hidden code') + '">' +
        S.secret.map((s, i) => S.over
          ? '<span class="cb-peg cb-shown' + (fx.flip ? ' cb-flip' : '') + '" style="--i:' + i + '">' + symSVG(s) + '</span>'
          : '<span class="cb-peg cb-hid">?</span>').join('') + '</span></div>';
      for (let k = 0; k < L.guesses; k++) {
        const g = S.history[k];
        if (g) {
          const cls = (k === fx.scored ? ' cb-in' : '') + (S.solved && k === S.history.length - 1 ? ' cb-win' : '') +
            (d && d.best === k ? ' cb-best' : '') + (d && d.rows[k].broke >= 0 ? ' cb-broke' : '');
          h += '<div class="cb-row cb-done' + cls + '"><span class="cb-num">' + (k + 1) + '</span>' +
            '<span class="cb-pegs" role="img" aria-label="Guess ' + (k + 1) + ': ' + codeWords(g.guess) + '">' +
            g.guess.map(s => '<span class="cb-peg">' + symSVG(s) + '</span>').join('') + '</span>' +
            clueHTML(g.clue) + (board ? '<span class="cb-rest"><b>' + num(S.counts[k + 1]) + '</b> left</span>' : '') + '</div>';
        } else if (k === S.history.length && !S.over) {
          const nextSpot = S.entry.indexOf(null);
          h += '<div class="cb-row cb-now' + (fx.nudge ? ' cb-shake' : '') + '"><span class="cb-num">' + (k + 1) + '</span><span class="cb-pegs">' +
            S.entry.map((s, i) => s === null
              ? '<span class="cb-peg cb-empty' + (i === nextSpot ? ' cb-next' : '') + '"></span>'
              : '<button class="cb-peg cb-slot' + (i === fx.fresh ? ' cb-pop' : '') + '" type="button" data-spot="' + i + '" aria-label="Spot ' + (i + 1) + ', ' +
                SYMBOLS[s] + '. Tap to take it back.">' + symSVG(s) + '</button>').join('') +
            '</span></div>';
        } else {
          h += '<div class="cb-row cb-later"><span class="cb-num">' + (k + 1) + '</span><span class="cb-pegs">' +
            blankRow().map(() => '<span class="cb-peg"></span>').join('') + '</span></div>';
        }
      }
      q('.cb-board').innerHTML = h + '</div>';
      root.classList.toggle('cb-over', S.over);
      root.style.setProperty('--ph-done', rowsHigh(S.history.length + 1));
      fx.fresh = -1; fx.scored = -1; fx.flip = false; fx.nudge = false;
      if (focusSpot >= 0) {
        const slots = host.querySelectorAll('.cb-slot');
        const again = host.querySelector('.cb-slot[data-spot="' + focusSpot + '"]') || slots[slots.length - 1];
        if (again) again.focus(); else stage.focus({ preventScroll: true });
      }
    }
    function renderKeys() {
      const box = q('.cb-keys');
      if (box.children.length === S.L.syms) return;
      box.style.setProperty('--syms', S.L.syms);
      box.innerHTML = Array.from({ length: S.L.syms }, (_, s) => '<button class="cb-key" type="button" data-sym="' + s + '" aria-label="' + NAMES[s] + '">' +
        symSVG(s) + '<i aria-hidden="true">' + (s + 1) + '</i></button>').join('');
    }
    function debriefHTML() {
      if (!S.history.length) return '';
      const d = debrief(S.L.id, S.history, S.solved);
      const row = (tag, body) => '<div class="cb-tip"><span class="label">' + tag + '</span><span class="cb-tip-body">' + body + '</span></div>';
      let h = row('Codes left', '<span class="cb-chain">' + [d.total].concat(d.rows.map(r => r.left)).map(n => '<span class="cb-step">' + num(n) + '</span>')
        .join('<span class="cb-arrow" aria-hidden="true">→</span>') + '</span>');
      if (d.best >= 0) {
        const r = d.rows[d.best], out = r.before - r.left;
        h += row('Best guess', '<span class="cb-gn">Guess ' + (d.best + 1) + '</span> ruled out <b>' + num(out) + ' of ' + num(r.before) + '</b> codes (' +
          Math.floor(100 * out / r.before) + '%), the biggest share of any guess.');
      }
      const broke = d.rows.map((r, k) => ({ k, j: r.broke })).filter(x => x.j >= 0);
      if (broke.length) h += row('Broke a clue', broke.map(x => '<span class="cb-gn cb-gn-o">Guess ' + (x.k + 1) + '</span> couldn’t have been the code. It didn’t fit the clue from guess ' + (x.j + 1) + '.').join('<br>'));
      else if (S.history.length > 1) h += row('Clues', 'Every guess fit all the clues before it.');
      return h;
    }
    /* [the big line, the small line under it] */
    function verdict() {
      const n = S.history.length;
      if (S.solved) return ['Cracked in ' + plural(n, 'guess', 'guesses'), S.hints ? 'With ' + plural(S.hints, 'hint', 'hints') : 'No hints'];
      return [n >= S.L.guesses ? 'Out of guesses' : 'Code shown', ''];
    }
    function renderSide() {
      if (board) q('.cb-count-n').textContent = num(S.codes.length);
      q('.cb-reveal').innerHTML = S.over ? debriefHTML()
        : S.tips.map((t, i) => '<div class="cb-tip cb-hint"><span class="label">Hint ' + (i + 1) + '</span><span class="cb-tip-body">' + tipHTML(t) + '</span></div>').join('');
      q('.cb-keys').hidden = S.over;
      const v = q('.cb-verdict');
      v.hidden = !S.over;
      const w = S.over ? verdict() : ['', ''];
      v.innerHTML = Lab.esc(w[0]) + (w[1] ? '<span>' + Lab.esc(w[1]) + '</span>' : '');
    }
    function renderActions() {
      const a = document.activeElement, had = a && host.contains(a) && a.dataset ? a.dataset.act : null;
      const btn = (act, label, cls, off) => '<button class="btn' + (cls ? ' ' + cls : '') + '" type="button" data-act="' + act + '"' + (off ? ' disabled' : '') + '>' + label + '</button>';
      let h = '';
      if (!S.over) {
        h += btn('hint', 'Hint', '', S.rung >= ladder.length);
        h += btn('show', 'Show me');
        h += btn('check', 'Check', 'primary cb-go', !full());
      } else h += btn('next', mode === 'daily' ? 'See results' : 'Next code', 'primary cb-go');
      q('.cb-actions').innerHTML = h;
      if (had) {
        const again = q('.cb-actions [data-act="' + had + '"]:not(:disabled)');
        if (again) again.focus(); else stage.focus({ preventScroll: true });
      }
    }
    function syncCheck() { const c = q('[data-act="check"]'); if (c) c.disabled = !full(); }
    function say(text) { q('.cb-sr').textContent = text; }
    function renderAll() { renderMeta(); renderBoard(); renderSide(); renderActions(); }

    /* ---------- Daily ---------- */
    const doneKey = date => ID + '.daily.' + date;
    const RUN = ID + '.run'; /* today's Daily in progress: leaving and coming back picks up where you were */
    function startDaily(replay) {
      S.daily = { date: ctx.date, code: dailyFor(ctx.date), replay: !!replay, start: Date.now(), end: 0, result: null };
      deal();
      if (!replay) resume();
    }
    function resume() {
      const run = Lab.store.get(RUN, null);
      if (!run || run.date !== S.daily.date || !Array.isArray(run.guesses)) return;
      const ok = g => Array.isArray(g) && g.length === S.L.len && g.every(s => s === (s | 0) && s >= 0 && s < S.L.syms);
      for (const guess of run.guesses.filter(ok).slice(0, S.L.guesses)) {
        const clue = score(S.secret, guess);
        S.history.push({ guess: guess.slice(), clue });
        S.codes = filterCodes(S.codes, guess, clue);
        S.counts.push(S.codes.length);
        if (clue[0] === S.L.len) break;
      }
      S.hints = Math.max(0, run.hints | 0);
      S.facts = Array.isArray(run.facts) ? run.facts.filter(f => f && typeof f.kind === 'string') : [];
      S.daily.start = Date.now() - Math.max(0, +run.ms || 0);
      const last = S.history[S.history.length - 1];
      if (last && last.clue[0] === S.L.len) { S.solved = true; endRound(S.hints ? 'helped' : 'clean'); }
      else if (S.history.length >= S.L.guesses) endRound('shown');
      renderAll();
    }
    function saveRun() {
      if (mode !== 'daily' || S.daily.replay || S.over) return;
      Lab.store.set(RUN, { date: S.daily.date, guesses: S.history.map(h => h.guess), hints: S.hints, facts: S.facts, ms: Date.now() - S.daily.start });
    }
    function finishDaily() {
      const d = S.daily;
      d.end = Date.now();
      d.result = { date: d.date, rows: S.history.map(h => h.clue), outcome: S.outcome, hints: S.hints, ms: d.end - d.start, len: S.L.len, limit: S.L.guesses };
      if (d.replay) return;
      /* the day's first finish stands: one made in another tab is never overwritten */
      if (Lab.store.get(doneKey(d.date), null)) d.replay = true;
      else Lab.store.set(doneKey(d.date), d.result);
      Lab.store.set(RUN, null);
    }
    function markRow(c, len) {
      let h = '';
      for (let i = 0; i < len; i++) h += i < c[0] ? MARK_RIGHT : i < c[0] + c[1] ? MARK_WRONG : MARK_NONE;
      return '<span class="cb-r-marks" role="img" aria-label="' + clueWords(c) + '">' + h + '</span>';
    }
    function showResults(result, replay) {
      const rows = Array.isArray(result.rows) ? result.rows : [];
      const len = result.len || LEVELS.medium.len, won = result.outcome !== 'shown', hints = result.hints || 0;
      const body = '<div class="cb-r-rows">' + rows.map((c, i) => '<div class="cb-r-row' + (won && i === rows.length - 1 ? ' cb-r-win' : '') + '">' +
        '<span class="cb-r-n">' + (i + 1) + '</span>' + markRow(c, len) + '</div>').join('') + '</div>';
      const sh = Lab.results({
        game: 'Codebreaker',
        sub: 'Daily · ' + Lab.dateWords(result.date) + (replay ? ' · replay' : ''),
        squares: [['clean', 'helped', 'shown'].indexOf(result.outcome) >= 0 ? result.outcome : 'shown'],
        body,
        stats: [[(won ? rows.length : 'X') + ' of ' + (result.limit || LEVELS.medium.guesses), 'Guesses'], [Lab.clock(result.ms || 0), 'Time'],
          [String(hints), hints === 1 ? 'Hint' : 'Hints']]
      }, { done: 'Done', onClose: ctx.home, extra: '<button class="btn" type="button" data-again>Play again</button>' });
      sh.el.querySelector('[data-again]').addEventListener('click', () => { sh.close(true); startDaily(true); });
    }

    /* ---------- setup (Play and Board) ---------- */
    function levelInfo(id) {
      const L = LEVELS[id];
      return miniRow(Array.from({ length: L.syms }, (_, s) => s)) +
        '<p>' + L.len + ' spots · ' + repeatsText(L) + ' · ' + L.guesses + ' guesses · ' + num(allCodes(id).length) + ' possible codes</p>';
    }
    function openSetup() {
      const pick = board ? S.bLevel : S.level;
      let chosen = pick;
      const chip = l => '<button class="chip" type="button" data-level="' + l + '" aria-pressed="' + (l === pick) + '">' + LEVELS[l].name + '</button>';
      const sh = Lab.sheet('<h2>Setup</h2><p class="label">Level</p><div class="chips" role="group" aria-label="Level">' + LEVEL_IDS.map(chip).join('') + '</div>' +
        '<div class="cb-lv">' + levelInfo(pick) + '</div>', {
        label: 'Setup',
        onClose() {
          if (chosen === pick) return;
          if (board) S.bLevel = chosen; else S.level = chosen;
          saveSettings();
          if (mode === 'play' && !S.over && S.history.length) S.streak = 0;
          deal();
        }
      });
      sh.el.addEventListener('click', e => {
        const c = e.target.closest('.chip');
        if (!c) return;
        chosen = c.dataset.level;
        sh.el.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c ? 'true' : 'false'));
        sh.el.querySelector('.cb-lv').innerHTML = levelInfo(chosen);
      });
    }

    /* ---------- input ---------- */
    host.addEventListener('click', e => {
      const key = e.target.closest('.cb-key');
      if (key) return place(+key.dataset.sym);
      const slot = e.target.closest('.cb-slot');
      if (slot) return clearSpot(+slot.dataset.spot);
      const a = e.target.closest('[data-act]');
      if (!a || a.disabled) return;
      const act = a.dataset.act;
      if (act === 'check') check();
      else if (act === 'hint') hint();
      else if (act === 'show') askShow();
      else if (act === 'next') next();
      else if (act === 'use') { const t = S.tips.find(x => x.kind === 'guess'); if (t) useGuess(t.guess.code); }
    });
    /* Enter checks the guess (or goes on, once a round is over). A button reached with Tab answers Enter itself;
       a button that was tapped or clicked doesn't keep Enter from checking. Typing a symbol takes focus off any button. */
    let keyNav = false;
    const onPointer = () => { keyNav = false; };
    function typing() {
      const a = document.activeElement;
      if (a && a !== stage && a.tagName === 'BUTTON') stage.focus({ preventScroll: true });
    }
    function onKey(e) {
      if (e.key === 'Tab') { keyNav = true; return; }
      if (Lab.sheetOpen() || e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
      const k = e.key.toLowerCase();
      if (k.length === 1 && k >= '1' && k <= '9') { if (+k > S.L.syms || S.over) return; typing(); place(+k - 1); }
      else if (k === 'backspace' || k === 'delete') {
        if (S.over) return;
        if (!(document.activeElement && document.activeElement.classList.contains('cb-slot'))) typing();
        backspace();
      }
      else if (k === 'enter') {
        if (keyNav && e.target.closest && e.target.closest('button')) return;
        if (S.over) next(); else check();
      }
      else if (k === 'h') hint();
      else if (k === 'n') { if (!S.over) return; next(); }
      else return;
      e.preventDefault();
    }
    function onHide() { if (document.visibilityState === 'hidden') saveRun(); }
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', onPointer, true);
    if (mode === 'daily') {
      document.addEventListener('visibilitychange', onHide);
      tick = setInterval(() => { if (S.daily && !S.over && !Lab.sheetOpen()) renderMeta(); }, 1000);
    }
    if (mode !== 'daily') ctx.setDock([{ label: 'Setup', onClick: openSetup }]);

    /* ---------- go ---------- */
    if (mode === 'daily') {
      const done = Lab.store.get(doneKey(ctx.date), null);
      startDaily(!!done);
      if (done && Array.isArray(done.rows)) showResults(done, false);
    } else deal();

    return {
      unmount() {
        saveRun();
        document.removeEventListener('keydown', onKey);
        document.removeEventListener('pointerdown', onPointer, true);
        document.removeEventListener('visibilitychange', onHide);
        clearInterval(tick);
      },
      state: S /* for the tests */
    };
  }

  const peg = s => '<span class="cb-art-peg">' + symSVG(s) + '</span>';
  Lab.register({
    id: ID,
    name: 'Codebreaker',
    modes: ['play', 'daily', 'board'],
    accent: ['#F2B640', '#FCEFD0'],
    icon: '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="#17324D"/><rect x="34" y="2" width="28" height="28" rx="7" fill="#17324D"/>' +
      '<rect x="2" y="34" width="28" height="28" rx="7" fill="#17324D"/><rect x="34" y="34" width="28" height="28" rx="7" fill="#F2B640"/>' +
      '<g stroke-linejoin="round" stroke-width="2"><circle cx="16" cy="16" r="7" fill="#fff"/><path d="M48 8.5 56 22.5H40z" fill="#fff" stroke="#fff"/>' +
      '<path d="M16 39.5 23.5 48 16 56.5 8.5 48z" fill="#fff" stroke="#fff"/>' +
      '<path d="M48 39 50.3 44.8 56.6 45.2 51.7 49.2 53.3 55.3 48 51.9 42.7 55.3 44.3 49.2 39.4 45.2 45.7 44.8z" fill="#17324D" stroke="#17324D"/></g></svg>',
    art: '<div class="cb-art" aria-hidden="true">' + [0, 2, 4].map(peg).join('') + '<span class="cb-art-peg cb-art-hid">?</span></div>',
    howTo: '<h2>How to play</h2><p>Crack the hidden code: a row of symbols.</p>' +
      '<ol><li>Tap symbols to fill the row. Tap one in the row to take it back.</li><li>Tap <b>Check</b>. The clue counts:' +
        '<span class="cb-howto-key"><span>' + MARK_RIGHT + 'right symbol, right spot</span><span>' + MARK_WRONG + 'right symbol, wrong spot</span></span></li></ol>' +
      '<div class="cb-howto-ex"><span class="label">Code</span>' + miniRow([0, 1, 2, 3]) + '<span></span>' +
        '<span class="label">Guess</span>' + miniRow([0, 2, 4, 1]) + clueHTML([1, 2]) + '</div>' +
      '<p>The circle is in the right spot. The triangle and the square are in the code, but in other spots. The star isn’t in the code. The clue only counts: it never says which symbol is which.</p>' +
      '<p>On Medium and Hard, a symbol can be used more than once.</p>' +
      '<p><b>Hint</b> gives you a nudge. <b>Show me</b> shows the code. <b>Daily</b> is one code, the same for everyone today.</p>' +
      '<p class="cb-howto-keys">Keys: <b>1</b>–<b>7</b> symbols · <b>Backspace</b> · <b>Enter</b> check · <b>H</b> hint · <b>N</b> next</p>',
    dailyDone: date => !!Lab.store.get(ID + '.daily.' + date, null),
    daily: dailyFor,
    mount
  });
})();

})();
Lab.start({ single: 'codebreaker' });
</script>
</body>
</html>
